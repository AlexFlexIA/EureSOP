<script>
(function () {
  'use strict';
  var etat = { session: null, onglet: 'accueil' };
  var $ = function (s) { return document.querySelector(s); };

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Appelle une fonction serveur et renvoie { ok, data } ou { ok: false, code, message }.
  function appel(nom) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { resolve({ ok: false, code: 'RESEAU', message: 'Le serveur ne répond pas. Vérifiez votre connexion et réessayez.' }); })
        [nom].apply(null, args);
    });
  }

  function idOperation() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'op-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function toast(texte) {
    var t = $('#toast');
    t.textContent = texte; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3500);
  }

  function pastille(classe, symbole, texte) {
    return '<span class="pastille ' + classe + '"><span aria-hidden="true">' + symbole + '</span>' + esc(texte) + '</span>';
  }

  var LIBELLES_DROITS = {
    consultation: 'Consulter', correctionPrevision: 'Corriger la prévision', arbitrage: 'Arbitrer et créer des versions',
    validation: 'Valider et verrouiller une version', correctionHistorique: 'Corriger l\'historique',
    validationGamme: 'Valider la gamme', voirBudget: 'Voir le budget', configuration: 'Configurer'
  };

  // ---------- Écrans ----------
  function ecranAccueil() {
    var s = etat.session;
    var droits = Object.keys(LIBELLES_DROITS).map(function (k) {
      return '<li>' + (s.droits[k] ? pastille('p-ok', '✓', 'Oui') : pastille('p-info', '✕', 'Non')) + ' ' + esc(LIBELLES_DROITS[k]) + '</li>';
    }).join('');
    return '<h1>Bonjour</h1><p class="sub">Campagne ' + esc(s.campagne.libelle || s.campagne.id) + '.</p>' +
      '<div class="grille"><div class="carte"><h2>Votre accès</h2><ul class="liste">' +
      '<li><b>Adresse</b> ' + esc(s.utilisateur) + '</li><li><b>Rôle</b> ' + s.roles.map(function (r) { return pastille('p-marque', '●', r); }).join(' ') + '</li></ul></div>' +
      '<div class="carte"><h2>Ce que vous pouvez faire</h2><ul class="liste">' + droits + '</ul></div></div>' +
      '<p class="note">Version ' + esc(s.version) + ' du socle. L\'historique, la prévision statistique et les corrections sont en place ; le cadençage et le stock arrivent ensuite.</p>';
  }

  function ecranVersions() {
    var s = etat.session;
    var types = [];
    if (s.droits.configuration) types.push(['PREV_TC', 'Prévision des TC']);
    if (s.droits.arbitrage) types.push(['STATISTIQUE', 'Statistique'], ['ARBITREE', 'Arbitrée (comité)']);
    if (s.droits.validation) types.push(['VALIDEE', 'Validée']);
    var form = types.length ?
      '<div class="carte"><h2>Créer une version</h2><form id="form-version" novalidate>' +
      '<label for="v-type">Type</label><select id="v-type">' + types.map(function (t) { return '<option value="' + t[0] + '">' + esc(t[1]) + '</option>'; }).join('') + '</select>' +
      '<label for="v-libelle">Libellé</label><input id="v-libelle" maxlength="120" placeholder="Ex. Reprévision après comité d\'octobre">' +
      '<label for="v-scenario">Scénario</label><input id="v-scenario" value="BASE" maxlength="40">' +
      '<label for="v-date">Date de la réunion S&amp;OP</label><input id="v-date" type="date">' +
      '<label for="v-com">Commentaire</label><textarea id="v-com" rows="2"></textarea>' +
      '<div class="rangee" style="margin-top:14px"><button class="btn pri" id="v-creer" type="submit">Créer la version</button><span id="v-message" class="note" role="status"></span></div></form></div>' :
      '<p class="note">Votre rôle ne permet pas de créer une version.</p>';
    return '<h1>Versions</h1><p class="sub">Chaque reprévision est conservée. Une seule version est courante par scénario.</p>' +
      '<div class="carte"><h2>Versions de la campagne</h2><div class="tableau" id="liste-versions">Chargement…</div></div>' + form;
  }

  function tableauVersions(liste) {
    if (!liste.length) return '<p class="note">Aucune version pour cette campagne. Créez la première ci-dessous.</p>';
    var peutVerrouiller = etat.session.droits.validation && etat.session.campagne.statut !== 'GELEE' && etat.session.campagne.statut !== 'CLOTUREE';
    return '<table><thead><tr><th>Version</th><th>Type</th><th>Scénario</th><th>Libellé</th><th>Statut</th><th>Créée</th><th></th></tr></thead><tbody>' +
      liste.slice().reverse().map(function (v) {
        var statut = v.statut === 'COURANTE' ? pastille('p-ok', '✓', 'Courante') : pastille('p-info', '●', 'Archivée');
        var verrou = v.verrouillee ? ' ' + pastille('p-marque', '■', 'Verrouillée') : '';
        var action = !v.verrouillee && peutVerrouiller ? '<button class="btn" data-verrou="' + esc(v.id) + '" type="button">Verrouiller</button>' : '';
        return '<tr><td><b>' + esc(v.id) + '</b></td><td>' + esc(v.type) + '</td><td>' + esc(v.scenario) + '</td><td>' + esc(v.libelle) +
          (v.commentaire ? '<br><span class="note">' + esc(v.commentaire) + '</span>' : '') + '</td><td>' + statut + verrou + '</td><td>' + esc(v.creeLe.replace('T', ' ')) + '<br><span class="note">' + esc(v.creePar) + '</span></td><td>' + action + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function chargerVersions() {
    appel('apiVersions').then(function (r) {
      var cible = $('#liste-versions');
      if (!cible) return;
      if (!r.ok) { cible.innerHTML = '<p class="note">' + esc(r.message) + '</p>'; return; }
      cible.innerHTML = tableauVersions(r.data);
      Array.prototype.forEach.call(cible.querySelectorAll('[data-verrou]'), function (b) {
        b.onclick = function () {
          b.disabled = true;
          appel('apiVerrouillerVersion', b.getAttribute('data-verrou'), idOperation()).then(function (res) {
            toast(res.ok ? 'Version verrouillée.' : res.message);
            chargerVersions();
          });
        };
      });
    });
  }

  function brancherFormVersion() {
    var f = $('#form-version');
    if (!f) return;
    f.onsubmit = function (e) {
      e.preventDefault();
      var bouton = $('#v-creer'), msg = $('#v-message');
      if (!$('#v-libelle').value.trim()) { msg.textContent = 'Le libellé est obligatoire.'; $('#v-libelle').focus(); return; }
      bouton.disabled = true; msg.textContent = 'Enregistrement…';
      appel('apiCreerVersion', {
        type: $('#v-type').value, libelle: $('#v-libelle').value, scenario: $('#v-scenario').value,
        dateReunion: $('#v-date').value, commentaire: $('#v-com').value
      }, idOperation()).then(function (r) {
        bouton.disabled = false;
        if (!r.ok) { msg.textContent = r.message; return; }
        msg.textContent = '';
        $('#v-libelle').value = ''; $('#v-com').value = '';
        toast('Version ' + r.data.resultat.idVersion + ' créée.');
        chargerVersions();
      });
    };
  }

  // ---------- Historique du PAC ----------
  var nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  function n0(v) { return nf0.format(Math.round(v || 0)); }
  function variation(a, b) {
    if (!b) return a ? pastille('p-info', '●', 'Nouveau') : '';
    var p = (a - b) / Math.abs(b) * 100;
    var classe = Math.abs(p) >= 15 ? 'p-warn' : 'p-info';
    return pastille(classe, p >= 0 ? '▲' : '▼', (p >= 0 ? '+' : '') + nf0.format(Math.round(p)) + ' %');
  }

  function ecranHistorique() {
    return '<h1>Historique des ventes</h1><p class="sub">Ventes du PAC des années passées, lues dans les fichiers déclarés dans SOURCES.</p>' +
      '<div id="h-contenu"><div class="carte">Chargement…</div></div>';
  }

  function dessinerHistorique(d) {
    var an = d.annees, derniere = an[an.length - 1], avant = an.length > 1 ? an[an.length - 2] : null;
    var entites = d.sources.map(function (s) { return s.entite; });
    var cartes = d.totaux.map(function (t) {
      return '<tr><td>' + esc(t.entite) + '</td><td>' + esc(t.annee) + '</td><td class="n">' + n0(t.articles) + '</td><td class="n">' + n0(t.tc) +
        '</td><td class="n">' + n0(t.qte) + '</td><td class="n">' + n0(t.ha) + '</td><td class="n">' + n0(t.montant) + ' €</td></tr>';
    }).join('');
    var haut = '<div class="carte"><h2>Totaux par entité et par année</h2><div class="tableau"><table><thead><tr><th>Entité</th><th>Année</th><th>Articles</th><th>TC</th><th>Quantité</th><th>Hectares</th><th>Montant HT</th></tr></thead><tbody>' + cartes + '</tbody></table></div>' +
      '<p class="note">La quantité additionne des unités de stock différentes (sacs, bidons, kg). Le passage en tonnes viendra avec le poids des articles.</p></div>';
    var filtres = '<div class="carte"><h2>Articles</h2><div class="grille"><div><label for="h-entite">Entité</label><select id="h-entite"><option value="">Toutes</option>' +
      entites.map(function (e) { return '<option>' + esc(e) + '</option>'; }).join('') + '</select></div>' +
      '<div><label for="h-texte">Rechercher (code ou libellé)</label><input id="h-texte" type="search" maxlength="60"></div></div>' +
      '<div class="tableau" id="h-table" style="margin-top:12px"></div><p class="note" id="h-note"></p></div>';
    var avert = d.avertissements.length ? '<div class="carte"><h2>Points d\'attention</h2><ul class="liste">' + d.avertissements.map(function (a) { return '<li>' + pastille('p-warn', '⚠', 'Attention') + ' ' + esc(a) + '</li>'; }).join('') + '</ul></div>' : '';
    $('#h-contenu').innerHTML = haut + filtres + avert;

    function liste() {
      var e = $('#h-entite').value, q = $('#h-texte').value.trim().toLowerCase();
      var sel = d.articles.filter(function (a) {
        return (!e || a.entite === e) && (!q || a.code.toLowerCase().indexOf(q) >= 0 || a.libelle.toLowerCase().indexOf(q) >= 0);
      });
      var entete = '<th>Code</th><th>Libellé</th><th>Entité</th>' + an.map(function (y) { return '<th>Qté ' + esc(y) + '</th>'; }).join('') +
        '<th>Montant ' + esc(derniere) + '</th>' + (avant ? '<th>' + esc(derniere) + ' vs ' + esc(avant) + '</th>' : '');
      var corps = sel.slice(0, 200).map(function (a) {
        var p = a.parAnnee, l = p[derniere] || { qte: 0, mt: 0 }, b = avant ? (p[avant] || { qte: 0 }) : null;
        return '<tr><td>' + esc(a.code) + '</td><td>' + esc(a.libelle) + '</td><td>' + esc(a.entite) + '</td>' +
          an.map(function (y) { return '<td class="n">' + (p[y] ? n0(p[y].qte) : '–') + '</td>'; }).join('') +
          '<td class="n">' + n0(l.mt) + ' €</td>' + (avant ? '<td>' + variation(l.qte, b.qte) + '</td>' : '') + '</tr>';
      }).join('');
      $('#h-table').innerHTML = sel.length ? '<table><thead><tr>' + entete + '</tr></thead><tbody>' + corps + '</tbody></table>' : '<p class="note">Aucun article ne correspond.</p>';
      $('#h-note').textContent = sel.length + ' article(s)' + (sel.length > 200 ? ', 200 affichés : affinez la recherche' : '') +
        (d.tronque ? ' · ' + d.nbArticles + ' articles au total, les ' + d.articles.length + ' premiers par montant ' + derniere + ' sont chargés' : '') + '.';
    }
    $('#h-entite').onchange = liste;
    $('#h-texte').oninput = liste;
    liste();
  }

  function chargerHistorique() {
    appel('apiHistorique').then(function (r) {
      var c = $('#h-contenu');
      if (!c) return;
      if (!r.ok) { c.innerHTML = '<div class="carte"><h2>Historique indisponible</h2><p>' + esc(r.message) + '</p><p class="note">Code : ' + esc(r.code) + '</p></div>'; return; }
      dessinerHistorique(r.data);
    });
  }

  // ---------- Prévision statistique ----------
  // Année prévue (campagne) et année de référence (la précédente). Vides si la campagne n'a pas d'année de prévision.
  function anneesPrevision() {
    var a = etat.session.campagne.anneePrevision;
    return { prevue: a ? String(a) : '', reference: a ? String(a - 1) : '' };
  }

  function ecranPrevision() {
    var y = anneesPrevision();
    return '<h1>Prévision statistique' + (y.prevue ? ' ' + esc(y.prevue) : '') + '</h1><p class="sub">Moyenne pondérée des années d\'historique du PAC, par article et par entité' + (y.prevue ? ', pour prévoir ' + esc(y.prevue) : '') + '. C\'est le point de départ du comité, à comparer ensuite à la saisie des TC.</p>' +
      '<div id="p-contenu"><div class="carte">Chargement…</div></div>';
  }

  function dessinerPrevision(d) {
    var y = anneesPrevision();
    var ouverte = etat.session.campagne.statut !== 'GELEE' && etat.session.campagne.statut !== 'CLOTUREE';
    var peutCalculer = etat.session.droits.arbitrage && ouverte;
    var poids = d.ponderation.join(' / ');
    var action = peutCalculer ?
      '<div class="rangee" style="margin-top:12px"><button class="btn" id="p-calculer" type="button">' + (d.version ? 'Recalculer la statistique' : 'Calculer la prévision statistique') + '</button>' +
      (d.version ? '<button class="btn pri" id="p-arbitrer" type="button">Appliquer les corrections (version arbitrée)</button>' : '') +
      '<span id="p-message" class="note" role="status"></span></div>' +
      '<p class="note">Pondération (dernière année en premier) : ' + esc(poids) + ', réglage PONDERATION_ANNEES. Un article sans vente la dernière année n\'est pas reconduit. Chaque calcul crée une nouvelle version et archive la précédente. Les corrections, événements, arrêts et substitutions se saisissent dans l\'onglet Corrections ; ils ne comptent qu\'une fois appliqués ici.</p>' :
      '<p class="note">Votre rôle ne permet pas de lancer le calcul.</p>';
    var avert = (etat.avertissements || []).length ? '<div class="carte"><h2>Points d\'attention du dernier calcul</h2><ul class="liste">' + etat.avertissements.map(function (a) { return '<li>' + pastille('p-warn', '⚠', 'Attention') + ' ' + esc(a) + '</li>'; }).join('') + '</ul></div>' : '';
    if (!d.version) {
      $('#p-contenu').innerHTML = '<div class="carte"><h2>Aucune prévision pour le moment</h2><p>Le calcul lit l\'historique, crée une version « Statistique » et remplit la prévision.</p>' + action + '</div>';
      brancherCalcul();
      ajouterEssai();
      return;
    }
    var v = d.version;
    var entete = '<div class="carte"><h2>Version courante</h2><ul class="liste"><li><b>' + esc(v.id) + '</b> ' + pastille('p-marque', '●', v.type) + (v.verrouillee ? ' ' + pastille('p-marque', '■', 'Verrouillée') : '') + '</li>' +
      '<li>' + esc(v.libelle) + '</li><li class="note">Créée le ' + esc(v.creeLe.replace('T', ' ')) + ' par ' + esc(v.creePar) + '</li></ul>' + action + '</div>' + avert;
    var th = function (t) { return '<th>' + t + '</th>'; };
    var cols = th('Réalisé ' + esc(y.reference || 'précédent')) + th('Statistique ' + esc(y.prevue)) + th('Événements') + th('Corrections') + th('Substitutions') + th('Retenue') + th('Écart');
    var tot = '<div class="carte"><h2>Totaux par entité</h2><div class="tableau"><table><thead><tr><th>Entité</th><th>Articles</th>' + th('Réalisé ' + esc(y.reference || 'précédent')) + th('Statistique ' + esc(y.prevue)) + th('Retenue') + th('Écart') + '</tr></thead><tbody>' +
      d.totaux.map(function (t) {
        return '<tr><td>' + esc(t.entite) + '</td><td class="n">' + n0(t.articles) + '</td><td class="n">' + n0(t.n1) + '</td><td class="n">' + n0(t.statistique) + '</td><td class="n"><b>' + n0(t.retenue) + '</b></td><td>' + variation(t.retenue, t.n1) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="note">La quantité additionne des unités de stock différentes (sacs, bidons, kg). L\'écart compare la quantité retenue au réalisé.</p></div>';
    var liste = '<div class="carte"><h2>Articles</h2><div class="grille"><div><label for="p-entite">Entité</label><select id="p-entite"><option value="">Toutes</option>' +
      d.totaux.map(function (t) { return '<option>' + esc(t.entite) + '</option>'; }).join('') + '</select></div>' +
      '<div><label for="p-texte">Rechercher (code ou libellé)</label><input id="p-texte" type="search" maxlength="60"></div></div>' +
      '<div style="margin-top:10px"><label style="display:inline"><input type="checkbox" id="p-modifies" style="width:auto"> Seulement les articles modifiés par une correction, un événement ou une substitution</label></div>' +
      '<div class="tableau" id="p-table" style="margin-top:12px"></div><p class="note" id="p-note"></p></div>';
    $('#p-contenu').innerHTML = entete + tot + liste;
    brancherCalcul();
    ajouterEssai();

    function filtrer() {
      var e = $('#p-entite').value, q = $('#p-texte').value.trim().toLowerCase(), m = $('#p-modifies').checked;
      var sel = d.articles.filter(function (a) {
        return (!e || a.entite === e) && (!q || a.code.toLowerCase().indexOf(q) >= 0 || a.libelle.toLowerCase().indexOf(q) >= 0) && (!m || a.evenements || a.correction || a.substitution);
      });
      var cel = function (x) { return '<td class="n">' + (x ? (x > 0 ? '+' : '') + n0(x) : '–') + '</td>'; };
      $('#p-table').innerHTML = sel.length ? '<table><thead><tr><th>Code</th><th>Libellé</th><th>Entité</th>' + cols + '</tr></thead><tbody>' +
        sel.slice(0, 200).map(function (a) {
          return '<tr><td>' + esc(a.code) + '</td><td>' + esc(a.libelle) + '</td><td>' + esc(a.entite) + '</td><td class="n">' + n0(a.n1) + '</td><td class="n">' + n0(a.statistique) + '</td>' +
            cel(a.evenements) + cel(a.correction) + cel(a.substitution) + '<td class="n"><b>' + n0(a.retenue) + '</b></td><td>' + variation(a.retenue, a.n1) + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="note">Aucun article ne correspond.</p>';
      $('#p-note').textContent = sel.length + ' article(s)' + (sel.length > 200 ? ', 200 affichés : affinez la recherche' : '') + (d.tronque ? ' · ' + d.nbArticles + ' articles au total, les ' + d.articles.length + ' premiers par quantité sont chargés' : '') + '.';
    }
    $('#p-entite').onchange = filtrer; $('#p-texte').oninput = filtrer; $('#p-modifies').onchange = filtrer; filtrer();
  }

  function ajouterEssai() {
    var cible = $('#p-contenu');
    cible.insertAdjacentHTML('beforeend', '<div class="carte"><h2>Quelle pondération choisir ?</h2>' +
      '<p>L\'application refait la prévision de la dernière année en n\'utilisant que les années d\'avant, puis la compare à ce qui s\'est réellement vendu. Elle vous montre quelle pondération se serait le moins trompée sur vos données.</p>' +
      '<div class="rangee"><button class="btn" id="e-lancer" type="button">Tester les pondérations sur l\'historique</button><span id="e-message" class="note" role="status"></span></div><div id="e-resultat" style="margin-top:12px"></div></div>');
    $('#e-lancer').onclick = function () {
      var b = $('#e-lancer'), msg = $('#e-message');
      b.disabled = true; msg.textContent = 'Test en cours…';
      appel('apiEssaiPonderation').then(function (r) {
        b.disabled = false; msg.textContent = '';
        if (!r.ok) { $('#e-resultat').innerHTML = '<p>' + esc(r.message) + '</p>'; return; }
        var d = r.data;
        var lignes = d.resultats.map(function (x, i) {
          var biais = Math.round(x.biais * 100);
          return '<tr><td>' + esc(x.ponderation.join(' / ')) + (x.actuelle ? ' ' + pastille('p-info', '●', 'Réglage actuel') : '') + (i === d.meilleur ? ' ' + pastille('p-ok', '✓', 'La plus juste') : '') + '</td>' +
            '<td class="n">' + Math.round(x.erreur * 100) + ' %</td><td class="n">' + (biais > 0 ? '+' : '') + biais + ' %</td></tr>';
        }).join('');
        $('#e-resultat').innerHTML = '<p class="note">Test sur ' + esc(d.anneeTestee) + ' avec ' + esc(d.anneesBase.join(', ')) + ' (' + n0(d.nbArticles) + ' articles). La première valeur de la pondération est celle de l\'année la plus récente.</p>' +
          '<div class="tableau"><table><thead><tr><th>Pondération</th><th>Erreur</th><th>Biais</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' +
          '<p class="note"><b>Erreur :</b> écart moyen entre prévu et réel, article par article, rapporté aux ventes (plus c\'est bas, mieux c\'est). <b>Biais :</b> écart sur le total (positif = on surestime, négatif = on sous-estime). Pour changer la pondération, modifiez PONDERATION_ANNEES dans REGLAGES, puis recalculez.</p>';
      });
    };
  }

  function brancherCalcul() {
    [['#p-calculer', 'apiCalculerStatistique', 'Statistique'], ['#p-arbitrer', 'apiArbitrer', 'Arbitrée']].forEach(function (def) {
      var b = $(def[0]);
      if (!b) return;
      b.onclick = function () {
        var msg = $('#p-message');
        Array.prototype.forEach.call(document.querySelectorAll('#p-calculer, #p-arbitrer'), function (x) { x.disabled = true; });
        msg.textContent = 'Calcul en cours, cela peut durer une minute…';
        appel(def[1], {}, idOperation()).then(function (r) {
          if (!r.ok) {
            Array.prototype.forEach.call(document.querySelectorAll('#p-calculer, #p-arbitrer'), function (x) { x.disabled = false; });
            msg.textContent = r.message; return;
          }
          etat.avertissements = r.data.resultat.avertissements || [];
          toast('Version ' + r.data.resultat.idVersion + ' créée, ' + r.data.resultat.lignes + ' lignes.');
          chargerPrevision();
        });
      };
    });
  }

  function chargerPrevision() {
    appel('apiPrevision').then(function (r) {
      var c = $('#p-contenu');
      if (!c) return;
      if (!r.ok) { c.innerHTML = '<div class="carte"><h2>Prévision indisponible</h2><p>' + esc(r.message) + '</p><p class="note">Code : ' + esc(r.code) + '</p></div>'; return; }
      dessinerPrevision(r.data);
    });
  }

  // ---------- Corrections, événements, arrêts, substitutions ----------
  var NATURES = {
    CORRECTION: { libelle: 'Correction', aide: 'Ajoute ou retire une quantité (ou un pourcentage) sur un article, avec son motif.' },
    EVENEMENT: { libelle: 'Événement commercial', aide: 'Polco, promotion, grand compte, appel d\'offres, mesure réglementaire : un apport du commerce.' },
    ARRET: { libelle: 'Arrêt de produit', aide: 'L\'article disparaît : sa prévision tombe à zéro (ou d\'un taux). Rien n\'est reporté.' },
    SUBSTITUTION: { libelle: 'Substitution', aide: 'Une part des ventes d\'un ancien article passe sur un nouvel article.' }
  };
  var TYPES_EVT = [['POLCO', 'Polco'], ['PROMO', 'Promotion'], ['GRAND_COMPTE', 'Grand compte'], ['APPEL_OFFRES', 'Appel d\'offres'], ['REGLEMENTAIRE', 'Réglementaire']];

  function champ(id, libelle, type, extra) {
    return '<div><label for="a-' + id + '">' + libelle + '</label><input id="a-' + id + '" type="' + (type || 'text') + '" maxlength="120" ' + (extra || '') + '></div>';
  }
  function liste(id, libelle, options) {
    return '<div><label for="a-' + id + '">' + libelle + '</label><select id="a-' + id + '">' + options.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select></div>';
  }

  function formulaire(nature, entites) {
    var ent = function (obligatoire) { return liste('entite', 'Entité', (obligatoire ? [] : [['', 'Toutes']]).concat(entites.map(function (e) { return [e, e]; }))); };
    var semaines = champ('sd', 'Semaine de début (facultatif)', 'text', 'placeholder="2027-S06"') + champ('sf', 'Semaine de fin (facultatif)', 'text', 'placeholder="2027-S10"');
    var impact = champ('qte', 'Quantité (+ ou −)', 'text', 'inputmode="decimal"') + champ('pct', 'ou pourcentage (+ ou −)', 'text', 'inputmode="decimal"');
    var dates = champ('de', 'Date d\'effet (facultatif)', 'date') + champ('df', 'Date de fin (facultatif)', 'date');
    if (nature === 'CORRECTION') return ent(true) + champ('code', 'Code produit') + impact + champ('motif', 'Motif (obligatoire)') + semaines;
    if (nature === 'EVENEMENT') return liste('type', 'Type', TYPES_EVT) + ent(true) + champ('code', 'Code produit') + impact + champ('com', 'Commentaire') + semaines;
    if (nature === 'ARRET') return champ('ancien', 'Code du produit arrêté') + ent(false) + champ('taux', 'Part retirée, % (100 par défaut)', 'text', 'inputmode="decimal"') + dates + champ('com', 'Commentaire');
    return champ('ancien', 'Code de l\'ancien produit') + champ('nouveau', 'Code du nouveau produit') + ent(false) + champ('taux', 'Part reportée, % (100 par défaut)', 'text', 'inputmode="decimal"') +
      liste('motif', 'Motif', [['REMPLACEMENT', 'Remplacement'], ['REGLEMENTAIRE', 'Réglementaire'], ['AUTRE', 'Autre']]) + dates + champ('com', 'Commentaire');
  }

  function ecranCorrections() {
    return '<h1>Corrections et événements</h1><p class="sub">Ce que vous saisissez ici n\'agit sur la prévision qu\'une fois la version arbitrée créée, dans l\'écran Prévision.</p><div id="a-contenu"><div class="carte">Chargement…</div></div>';
  }

  function peutSaisir(nature) {
    var d = etat.session.droits, ouverte = etat.session.campagne.statut !== 'GELEE' && etat.session.campagne.statut !== 'CLOTUREE';
    if (!ouverte) return false;
    return nature === 'ARRET' || nature === 'SUBSTITUTION' ? (d.validationGamme || d.arbitrage) : d.correctionPrevision;
  }

  function tableauSaisies(titre, vide, entete, lignes, nature) {
    return '<div class="carte"><h2>' + titre + '</h2>' + (lignes.length ? '<div class="tableau"><table><thead><tr>' + entete + '<th></th></tr></thead><tbody>' + lignes.map(function (l) {
      return '<tr>' + l.cellules + '<td>' + (peutSaisir(nature) ? '<button class="btn" data-annuler="' + esc(l.id) + '" data-nature="' + nature + '" type="button">Annuler</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="note">' + vide + '</p>') + '</div>';
  }

  function dessinerCorrections(d) {
    var q = function (v) { return v === '' ? '–' : (Number(v) > 0 ? '+' : '') + n0(Number(v)); };
    var impact = function (x) { return x.quantite !== '' ? q(x.quantite) : q(x.pourcent) + ' %'; };
    var natures = Object.keys(NATURES).filter(peutSaisir);
    var form = natures.length ? '<div class="carte"><h2>Nouvelle saisie</h2><label for="a-nature">Nature</label><select id="a-nature">' +
      natures.map(function (n) { return '<option value="' + n + '">' + esc(NATURES[n].libelle) + '</option>'; }).join('') + '</select><p class="note" id="a-aide"></p>' +
      '<form id="a-form" novalidate><div class="grille" id="a-champs"></div><div class="rangee" style="margin-top:14px"><button class="btn pri" type="submit" id="a-envoyer">Enregistrer</button><span id="a-message" class="note" role="status"></span></div></form></div>' :
      '<div class="carte"><p class="note">Votre rôle ne permet pas de saisir de correction ou d\'événement (périmètre global requis).</p></div>';
    var c = tableauSaisies('Corrections actives', 'Aucune correction.', '<th>Numéro</th><th>Produit</th><th>Entité</th><th>Impact</th><th>Motif</th><th>Saisie par</th>',
      d.corrections.map(function (x) { return { id: x.id, cellules: '<td>' + esc(x.id) + '</td><td>' + esc(x.code) + '</td><td>' + esc(x.entite) + '</td><td class="n">' + impact(x) + '</td><td>' + esc(x.motif) + '</td><td>' + esc(x.par) + '</td>' }; }), 'CORRECTION');
    var e = tableauSaisies('Événements actifs', 'Aucun événement.', '<th>Numéro</th><th>Type</th><th>Produit</th><th>Entité</th><th>Impact</th><th>Commentaire</th><th>Saisi par</th>',
      d.evenements.map(function (x) { return { id: x.id, cellules: '<td>' + esc(x.id) + '</td><td>' + esc(x.type) + '</td><td>' + esc(x.code) + '</td><td>' + esc(x.entite) + '</td><td class="n">' + impact(x) + '</td><td>' + esc(x.commentaire) + '</td><td>' + esc(x.par) + '</td>' }; }), 'EVENEMENT');
    var sb = tableauSaisies('Arrêts de produit et substitutions actifs', 'Aucun arrêt ni substitution.', '<th>Numéro</th><th>Nature</th><th>Ancien</th><th>Nouveau</th><th>Entité</th><th>Taux</th><th>Période</th><th>Commentaire</th>',
      d.substitutions.map(function (x) { return { id: x.id, cellules: '<td>' + esc(x.id) + '</td><td>' + (x.nature === 'ARRET' ? pastille('p-warn', '■', 'Arrêt') : pastille('p-info', '→', 'Substitution')) + '</td><td>' + esc(x.ancien) + '</td><td>' + esc(x.nouveau || '–') + '</td><td>' + esc(x.entite || 'Toutes') + '</td><td class="n">' + esc(x.taux) + ' %</td><td>' + esc((x.effet || '') + (x.fin ? ' → ' + x.fin : '')) + '</td><td>' + esc(x.commentaire) + '</td>' }; }), 'SUBSTITUTION');
    $('#a-contenu').innerHTML = form + c + e + sb +
      '<p class="note">Les arrêts et substitutions sont aussi visibles dans l\'onglet SUBSTITUTIONS des paramètres : ils valent pour toutes les campagnes tant qu\'ils sont actifs et dans leur période. Pas de chaînage : un report ne se répercute pas sur un autre report.</p>';

    function champs() {
      var n = $('#a-nature').value;
      $('#a-aide').textContent = NATURES[n].aide;
      $('#a-champs').innerHTML = formulaire(n, d.entites);
      $('#a-message').textContent = '';
    }
    if ($('#a-nature')) { $('#a-nature').onchange = champs; champs(); }

    var f = $('#a-form');
    if (f) f.onsubmit = function (ev) {
      ev.preventDefault();
      var n = $('#a-nature').value, g = function (id) { var x = $('#a-' + id); return x ? x.value.trim() : ''; };
      var entree = { nature: n, entite: g('entite'), code: g('code'), ancien: g('ancien'), nouveau: g('nouveau'), type: g('type'), quantite: g('qte'), pourcent: g('pct'),
        motif: g('motif'), commentaire: g('com'), semaineDebut: g('sd'), semaineFin: g('sf'), taux: g('taux'), dateEffet: g('de'), dateFin: g('df') };
      var b = $('#a-envoyer'), msg = $('#a-message');
      b.disabled = true; msg.textContent = 'Enregistrement…';
      appel('apiAjouterAjustement', entree, idOperation()).then(function (r) {
        b.disabled = false;
        if (!r.ok) { msg.textContent = r.message; return; }
        var res = r.data.resultat;
        toast('Saisie ' + res.id + ' enregistrée.' + (res.avertissement ? ' ' + res.avertissement : ''));
        chargerCorrections();
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-annuler]'), function (b) {
      b.onclick = function () {
        if (!window.confirm('Annuler la saisie ' + b.getAttribute('data-annuler') + ' ?')) return;
        b.disabled = true;
        appel('apiAnnulerAjustement', b.getAttribute('data-nature'), b.getAttribute('data-annuler'), idOperation()).then(function (r) {
          toast(r.ok ? 'Saisie annulée.' : r.message);
          chargerCorrections();
        });
      };
    });
  }

  function chargerCorrections() {
    appel('apiAjustements').then(function (r) {
      var c = $('#a-contenu');
      if (!c) return;
      if (!r.ok) { c.innerHTML = '<div class="carte"><h2>Saisies indisponibles</h2><p>' + esc(r.message) + '</p><p class="note">Code : ' + esc(r.code) + '</p></div>'; return; }
      dessinerCorrections(r.data);
    });
  }

  function ecranControles() {
    return '<h1>Contrôles de mise en service</h1><p class="sub">Vérifie les classeurs, la campagne et les accès avant l\'ouverture.</p>' +
      '<div class="carte"><div class="rangee"><button class="btn pri" id="c-lancer" type="button">Lancer les contrôles</button><span id="c-etat" class="note" role="status"></span></div><div id="c-resultats" style="margin-top:12px"></div></div>';
  }

  function brancherControles() {
    var b = $('#c-lancer');
    if (!b) return;
    b.onclick = function () {
      b.disabled = true; $('#c-etat').textContent = 'Contrôle en cours…';
      appel('apiControles').then(function (r) {
        b.disabled = false; $('#c-etat').textContent = '';
        if (!r.ok) { $('#c-resultats').innerHTML = '<p>' + esc(r.message) + '</p>'; return; }
        var classes = { OK: ['p-ok', '✓'], ATTENTION: ['p-warn', '⚠'], ERREUR: ['p-bad', '✕'] };
        $('#c-resultats').innerHTML = '<div class="tableau"><table><thead><tr><th>Résultat</th><th>Sujet</th><th>Détail</th></tr></thead><tbody>' +
          r.data.map(function (x) { var c = classes[x.niveau] || classes.ATTENTION; return '<tr><td>' + pastille(c[0], c[1], x.niveau) + '</td><td>' + esc(x.sujet) + '</td><td>' + esc(x.detail) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      });
    };
  }

  // ---------- Navigation ----------
  function onglets() {
    var o = [['accueil', 'Accueil'], ['historique', 'Historique'], ['corrections', 'Corrections'], ['prevision', 'Prévision'], ['versions', 'Versions']];
    if (etat.session.droits.configuration) o.push(['controles', 'Contrôles']);
    return o;
  }

  function afficher(nom) {
    etat.onglet = nom;
    $('#menu').innerHTML = onglets().map(function (o) {
      return '<button type="button" data-onglet="' + o[0] + '"' + (o[0] === nom ? ' aria-current="page"' : '') + '>' + esc(o[1]) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('#menu').querySelectorAll('button'), function (b) { b.onclick = function () { afficher(b.getAttribute('data-onglet')); }; });
    var c = $('#contenu');
    if (nom === 'historique') { c.innerHTML = ecranHistorique(); chargerHistorique(); }
    else if (nom === 'corrections') { c.innerHTML = ecranCorrections(); chargerCorrections(); }
    else if (nom === 'prevision') { c.innerHTML = ecranPrevision(); chargerPrevision(); }
    else if (nom === 'versions') { c.innerHTML = ecranVersions(); chargerVersions(); brancherFormVersion(); }
    else if (nom === 'controles') { c.innerHTML = ecranControles(); brancherControles(); }
    else c.innerHTML = ecranAccueil();
  }

  function demarrer() {
    $('#chargement').hidden = false; $('#erreur').hidden = true; $('#app').hidden = true;
    appel('apiDemarrage').then(function (r) {
      $('#chargement').hidden = true;
      if (!r.ok) {
        $('#erreur').hidden = false; $('#erreur-message').textContent = r.message; $('#erreur-code').textContent = r.code;
        return;
      }
      etat.session = r.data;
      $('#entete-campagne').textContent = r.data.campagne.libelle || r.data.campagne.id;
      var statut = r.data.campagne.statut;
      $('#entete-statut').className = 'pastille ' + (statut === 'OUVERTE' ? 'p-ok' : 'p-warn');
      $('#entete-statut').textContent = (statut === 'OUVERTE' ? '✓ ' : '⚠ ') + statut;
      $('#entete-utilisateur').textContent = r.data.utilisateur;
      $('#entete-roles').textContent = r.data.roles.join(', ');
      $('#app').hidden = false;
      afficher('accueil');
    });
  }

  $('#erreur-retour').onclick = demarrer;
  demarrer();
})();
</script>
