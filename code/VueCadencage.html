<script>
(function () {
  'use strict';
  var App = window.App, esc = App.esc;
  var NOMS_MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var libMois = function (m) { var p = m.split('-'); return NOMS_MOIS[Number(p[1]) - 1] + ' ' + p[0]; };

  App.vues.cadencage = function (c) {
    var etat = { d: null, niveau: 'GLOBAL', cle: '*', coefs: {}, de: '', a: '' };
    var droits = App.etat.session.droits;
    var ouverte = ['GELEE', 'CLOTUREE'].indexOf(App.etat.session.campagne.statut) < 0;
    var peutEditer = droits.arbitrage && ouverte;

    function jeu(niveau, cle) {
      return etat.d.jeux.filter(function (j) { return j.niveau === niveau && j.cle === cle; })[0] || null;
    }
    function charger(niveau, cle) {
      etat.niveau = niveau; etat.cle = cle;
      var j = jeu(niveau, cle);
      etat.coefs = {};
      if (j) Object.keys(j.semaines).forEach(function (k) { etat.coefs[k] = String(j.semaines[k]); });
      var ks = Object.keys(etat.coefs).map(Number).sort(function (x, y) { return x - y; });
      etat.de = ks.length ? String(ks[0]) : ''; etat.a = ks.length ? String(ks[ks.length - 1]) : '';
    }
    function somme() {
      return Object.keys(etat.coefs).reduce(function (s, k) { var v = Number(String(etat.coefs[k]).replace(',', '.')); return s + (isFinite(v) ? v : 0); }, 0);
    }
    function semainesAffichees() {
      var de = Number(etat.de), a = Number(etat.a);
      var ks = Object.keys(etat.coefs).map(Number);
      var lo = Math.min.apply(null, ks.concat(de > 0 ? [de] : [])), hi = Math.max.apply(null, ks.concat(a > 0 ? [a] : []));
      if (!isFinite(lo) || !isFinite(hi) || hi < lo) return [];
      var res = []; for (var n = lo; n <= Math.min(hi, etat.d.nbSemaines); n++) res.push(n);
      return res;
    }
    var valeur = function (n) { var v = Number(String(etat.coefs[n] === undefined ? '' : etat.coefs[n]).replace(',', '.')); return isFinite(v) ? v : 0; };

    function graphiqueCoefs() {
      var sem = semainesAffichees();
      if (!sem.length) return '<div class="vide">Indiquez la première et la dernière semaine de livraison.</div>';
      var s = [{ nom: 'Coefficient (%)', couleur: '#514F21', valeurs: sem.map(valeur) }];
      return App.barres(sem.map(function (n) { return 'S' + n; }), s, 200);
    }

    function editeur() {
      var d = etat.d, j = jeu(etat.niveau, etat.cle);
      var options = '<option value="GLOBAL|*"' + (etat.niveau === 'GLOBAL' ? ' selected' : '') + '>Cadençage global (tous les articles)</option>' +
        d.jeux.filter(function (x) { return x.niveau === 'ARTICLE'; }).map(function (x) { return '<option value="ARTICLE|' + esc(x.cle) + '"' + (etat.niveau === 'ARTICLE' && etat.cle === x.cle ? ' selected' : '') + '>Article ' + esc(x.cle) + '</option>'; }).join('') +
        (etat.niveau === 'ARTICLE' && !jeu('ARTICLE', etat.cle) ? '<option value="ARTICLE|' + esc(etat.cle) + '" selected>Article ' + esc(etat.cle) + ' (nouveau)</option>' : '') +
        (peutEditer ? '<option value="NOUVEAU">+ Cadençage d\'un article…</option>' : '');
      var statut = j ? App.pill(j.validation === 'VALIDE' ? 'ok' : 'warn', j.validation === 'VALIDE' ? 'Validé' : 'À valider', j.validation === 'VALIDE' ? '✓' : '⚠') + ' ' + App.pill('info', 'v' + j.version + ' · ' + j.origine.toLowerCase(), '●') : App.pill('info', 'Pas encore défini', 'ℹ');
      var sem = semainesAffichees();
      var grille = sem.length ? '<div class="scroll" style="max-height:300px"><table><thead><tr><th>Semaine</th><th>Mois</th><th class="n">Coefficient (%)</th></tr></thead><tbody>' + sem.map(function (n) {
        return '<tr><td>' + esc(d.annee + '-S' + ('0' + n).slice(-2)) + '</td><td>' + esc(libMois(moisDe(n))) + '</td><td class="n"><input class="cell' + (etat.coefs[n] !== undefined && etat.coefs[n] !== '' ? ' changed' : '') + '" type="text" inputmode="decimal" data-sem="' + n + '" value="' + esc(etat.coefs[n] === undefined ? '' : etat.coefs[n]) + '"' + (peutEditer ? '' : ' disabled') + ' aria-label="Coefficient semaine ' + n + '"></td></tr>';
      }).join('') + '</tbody></table></div>' : '';
      var total = somme(), ok = Math.abs(total - 100) <= 0.01;
      return '<div class="row"><label class="ctl" style="margin:0">Jeu de coefficients<select id="k-jeu">' + options + '</select></label>' + statut + '</div>' +
        (peutEditer ? '<div class="row" style="margin-top:12px"><label class="ctl" style="margin:0">Première semaine<input id="k-de" type="number" min="1" max="' + d.nbSemaines + '" value="' + esc(etat.de) + '" style="width:90px"></label>' +
          '<label class="ctl" style="margin:0">Dernière semaine<input id="k-a" type="number" min="1" max="' + d.nbSemaines + '" value="' + esc(etat.a) + '" style="width:90px"></label>' +
          '<button class="btn" id="k-unif" type="button">Répartir uniformément</button><button class="btn" id="k-coller" type="button">Coller des coefficients…</button></div>' : '') +
        '<div style="margin-top:12px">' + graphiqueCoefs() + '</div><div style="margin-top:10px">' + grille + '</div>' +
        '<div class="row" style="margin-top:12px"><span id="k-somme" class="pill ' + (ok ? 'p-ok' : 'p-bad') + '">' + (ok ? '✓ ' : '✖ ') + 'Total ' + (Math.round(total * 100) / 100) + ' %' + (ok ? '' : ' – doit faire 100 %') + '</span>' +
        (peutEditer ? '<button class="btn pri" id="k-save" type="button">Enregistrer le cadençage</button>' : '') +
        (j && droits.validation && ouverte && j.validation !== 'VALIDE' ? '<button class="btn" id="k-valider" type="button">Valider ce cadençage</button>' : '') +
        (peutEditer && j && j.niveau === 'ARTICLE' ? '<button class="btn" id="k-suppr" type="button">Supprimer</button>' : '') +
        '<span id="k-msg" class="note" role="status"></span></div>' +
        '<p class="note">Un coefficient est la part du besoin livrée la semaine indiquée ; les coefficients d\'un jeu font 100. Les semaines sont des semaines ISO de ' + esc(d.annee) + ', rattachées au mois de leur jeudi. Le cadençage d\'un article remplace le cadençage global pour cet article.</p>';
    }

    function moisDe(n) {
      // Mois du jeudi de la semaine ISO n de l'année de prévision (même règle que le serveur).
      var annee = etat.d.annee, jan4 = Date.UTC(annee, 0, 4), js = (new Date(jan4).getUTCDay() + 6) % 7;
      var j = new Date(jan4 - js * 86400000 + ((n - 1) * 7 + 3) * 86400000);
      return j.getUTCFullYear() + '-' + ('0' + (j.getUTCMonth() + 1)).slice(-2);
    }

    function resultat() {
      var d = etat.d, cle = App.UNITES[App.etat.unite].cle, ent = App.etat.entite;
      if (!d.semaines.length) return '<div class="vide">' + (d.nonCadences ? 'Aucun article n\'a de cadençage.' : 'La répartition apparaît quand une prévision existe et que le cadençage est défini.') + '</div>';
      var val = function (ligne) {
        return Object.keys(ligne.parEntite).reduce(function (s, e) { return s + (!ent || e === ent ? ligne.parEntite[e][cle] : 0); }, 0);
      };
      var totalGeneral = d.semaines.reduce(function (s, x) { return s + val(x); }, 0);
      var parts = d.semaines.map(function (x) { return { x: x, v: val(x) }; });
      var mois = d.mois.map(function (m) { return { m: m, v: val(m) }; });
      var series = [{ nom: App.UNITES[App.etat.unite].lbl, couleur: '#514F21', valeurs: mois.map(function (m) { return m.v; }) }];
      return '<div class="grid g2"><div>' + App.barres(mois.map(function (m) { return libMois(m.m.mois); }), series, 200) + '</div><div><table><thead><tr><th>Mois du comité</th><th class="n">Quantité retenue</th><th class="n">Part</th></tr></thead><tbody>' +
        mois.map(function (m) { return '<tr><td>' + esc(libMois(m.m.mois)) + '</td><td class="n">' + App.fmt(m.v) + '</td><td class="n">' + (totalGeneral ? Math.round(m.v / totalGeneral * 100) : 0) + ' %</td></tr>'; }).join('') +
        '<tr class="tot"><td>Total</td><td class="n">' + App.fmt(totalGeneral) + '</td><td class="n">100 %</td></tr></tbody></table></div></div>' +
        '<div class="scroll" style="max-height:300px;margin-top:12px"><table><thead><tr><th>Semaine</th><th>Mois</th><th class="n">Quantité retenue</th><th class="n">Part</th></tr></thead><tbody>' +
        parts.map(function (p) { return '<tr><td>' + esc(p.x.etiquette) + '</td><td>' + esc(libMois(p.x.mois)) + '</td><td class="n">' + App.fmt(p.v) + '</td><td class="n">' + (totalGeneral ? (p.v / totalGeneral * 100).toFixed(1).replace('.', ',') : '0') + ' %</td></tr>'; }).join('') + '</tbody></table></div>' +
        (d.nonCadences ? '<p class="note">' + App.pill('warn', d.nonCadences + ' article(s) sans cadençage', '⚠') + ' ne figurent pas dans cette répartation ni dans la publication. Définissez un cadençage global pour tous les couvrir.</p>' : '');
    }

    function dessiner() {
      var d = etat.d;
      if (!d) return;
      if (!d.annee) {
        c.innerHTML = '<h1>Cadençage</h1><p class="sub">Répartition du besoin de la campagne sur les semaines.</p><div class="card"><h2>Année de prévision manquante</h2><p>Renseignez la colonne « Annee prevision » de la campagne dans l\'onglet CAMPAGNES des paramètres.</p></div>';
        return;
      }
      c.innerHTML = '<h1>Cadençage</h1><p class="sub">Répartition du besoin de la campagne sur les semaines de livraison de ' + esc(d.annee) + ', puis sur les mois du comité.</p>' +
        '<div class="card"><h2>Coefficients <small>pourcentage du besoin par semaine ISO</small></h2>' + editeur() + '</div>' +
        '<div class="card"><h2>Résultat <small>' + esc(App.UNITES[App.etat.unite].lbl.toLowerCase()) + ', quantité retenue</small></h2>' + resultat() + '</div>';
      brancher();
    }

    function majSomme() {
      var total = somme(), ok = Math.abs(total - 100) <= 0.01, el = c.querySelector('#k-somme');
      el.className = 'pill ' + (ok ? 'p-ok' : 'p-bad');
      el.textContent = (ok ? '✓ ' : '✖ ') + 'Total ' + (Math.round(total * 100) / 100) + ' %' + (ok ? '' : ' – doit faire 100 %');
    }

    function brancher() {
      c.querySelector('#k-jeu').onchange = function (e) {
        var v = e.target.value;
        if (v === 'NOUVEAU') {
          App.dialogue({
            titre: 'Cadençage d\'un article', ok: 'Continuer',
            corps: '<label for="n-code">Code produit</label><input id="n-code" maxlength="30"><p class="note">Le cadençage de cet article remplacera le cadençage global pour lui.</p>',
            surOk: function () {
              var code = (document.querySelector('#dlg #n-code').value || '').trim();
              if (!code) return { ok: false, message: 'Le code produit est obligatoire.' };
              charger('ARTICLE', code);
              var g = jeu('GLOBAL', '*');
              if (g) Object.keys(g.semaines).forEach(function (k) { etat.coefs[k] = String(g.semaines[k]); });
              var ks = Object.keys(etat.coefs).map(Number).sort(function (x, y) { return x - y; });
              if (ks.length) { etat.de = String(ks[0]); etat.a = String(ks[ks.length - 1]); }
              dessiner(); return { ok: true };
            }
          });
          dessiner(); return;
        }
        var p = v.split('|'); charger(p[0], p.slice(1).join('|')); dessiner();
      };
      var de = c.querySelector('#k-de'), a = c.querySelector('#k-a');
      if (de) { de.onchange = function () { etat.de = de.value; dessiner(); }; a.onchange = function () { etat.a = a.value; dessiner(); }; }
      var u = c.querySelector('#k-unif');
      if (u) u.onclick = function () {
        var d1 = Number(etat.de), a1 = Number(etat.a);
        if (!(d1 >= 1 && a1 >= d1 && a1 <= etat.d.nbSemaines)) { c.querySelector('#k-msg').textContent = 'Indiquez une première et une dernière semaine valides (1 à ' + etat.d.nbSemaines + ').'; return; }
        etat.coefs = {};
        var n = a1 - d1 + 1, base = Math.floor(10000 / n) / 100, reste = Math.round((100 - base * n) * 100) / 100;
        for (var s = d1; s <= a1; s++) etat.coefs[s] = String(s === d1 ? Math.round((base + reste) * 100) / 100 : base);
        dessiner();
      };
      var col = c.querySelector('#k-coller');
      if (col) col.onclick = function () {
        App.dialogue({
          titre: 'Coller des coefficients', ok: 'Appliquer',
          corps: '<p class="note">Une valeur par semaine, séparées par des retours à la ligne, des espaces ou des points-virgules, à partir de la première semaine indiquée. Les valeurs peuvent venir d\'une colonne de votre fichier Qlik.</p><label for="p-vals">Coefficients (%)</label><textarea id="p-vals" rows="6"></textarea><label for="p-debut">Première semaine</label><input id="p-debut" type="number" min="1" value="' + esc(etat.de || '') + '">',
          surOk: function () {
            var txt = document.querySelector('#dlg #p-vals').value, debut = Number(document.querySelector('#dlg #p-debut').value);
            var vals = txt.split(/[\s;]+/).filter(Boolean).map(function (x) { return Number(x.replace(',', '.')); });
            if (!(debut >= 1) || !vals.length || vals.some(function (v) { return !isFinite(v) || v < 0; })) return { ok: false, message: 'Valeurs ou première semaine invalides.' };
            if (debut + vals.length - 1 > etat.d.nbSemaines) return { ok: false, message: 'Trop de valeurs : l\'année n\'a que ' + etat.d.nbSemaines + ' semaines.' };
            etat.coefs = {}; vals.forEach(function (v, i) { if (v > 0) etat.coefs[debut + i] = String(v); });
            etat.de = String(debut); etat.a = String(debut + vals.length - 1);
            dessiner(); return { ok: true };
          }
        });
      };
      App.$$('input[data-sem]', c).forEach(function (i) {
        i.oninput = function () { etat.coefs[i.getAttribute('data-sem')] = i.value; majSomme(); };
        i.onchange = function () { dessiner(); };
      });
      var sv = c.querySelector('#k-save');
      if (sv) sv.onclick = function () {
        sv.disabled = true; c.querySelector('#k-msg').textContent = 'Enregistrement…';
        App.appel('sauverCoefficients', [{ niveau: etat.niveau, cle: etat.cle, coefficients: etat.coefs, origine: 'MANUEL' }, App.idOperation()]).then(function (r) {
          sv.disabled = false;
          if (!r.ok) { c.querySelector('#k-msg').textContent = r.message; return; }
          App.toast('Cadençage enregistré (version ' + r.data.resultat.version + ').'); recharger(etat.niveau, etat.cle);
        });
      };
      var va = c.querySelector('#k-valider');
      if (va) va.onclick = function () {
        App.appel('validerCoefficients', [etat.niveau, etat.cle, App.idOperation()]).then(function (r) {
          if (!r.ok) { c.querySelector('#k-msg').textContent = r.message; return; }
          App.toast('Cadençage validé.'); recharger(etat.niveau, etat.cle);
        });
      };
      var su = c.querySelector('#k-suppr');
      if (su) su.onclick = function () {
        App.dialogue({
          titre: 'Supprimer le cadençage de l\'article ' + etat.cle, ok: 'Supprimer',
          corps: '<p>L\'article reprendra le cadençage global.</p>',
          surOk: function () {
            return App.appel('supprimerCoefficients', ['ARTICLE', etat.cle, App.idOperation()]).then(function (r) {
              if (!r.ok) return r; App.toast('Cadençage supprimé.'); recharger('GLOBAL', '*'); return r;
            });
          }
        });
      };
    }

    function recharger(niveau, cle) {
      App.invalider();
      return App.donnees('cadencage').then(function (r) {
        if (App.etat.ecran !== 'cadencage') return;
        if (!r.ok) { App.erreur(c, r); return; }
        etat.d = r.data;
        if (niveau && !(niveau === 'ARTICLE' && !jeu(niveau, cle))) charger(niveau, cle);
        else if (!jeu(etat.niveau, etat.cle) && etat.niveau !== 'ARTICLE') charger('GLOBAL', '*');
        dessiner();
      });
    }
    App.etat.redessiner = dessiner;
    recharger('GLOBAL', '*');
  };
})();
</script>
