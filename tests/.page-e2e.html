<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Eureden S&amp;OP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
:root{
  /* Charte Eureden : variables numériques. Interface claire, texte foncé, couleur en surface et en repère. */
  --eureden-noir:#000; --eureden-blanc:#fff; --eureden-jaune:#E8E22F;
  --eureden-jaune-vif:#F1EC42; --eureden-jaune-pale:#F8F5A7; --eureden-olive:#514F21;
  --eureden-gris-fonce:#444; --eureden-gris:#8A8A8A; --eureden-gris-clair:#F0F0F0;
  --eureden-vert-clair:#BAD264; --eureden-vert:#84BD66;
  --eureden-police:'Nunito Sans',Arial,sans-serif; --eureden-police-accent:'Caveat',cursive;
  /* Couleurs d'état : jamais le jaune de marque pour une alerte */
  --ok-bg:#E3F1DA; --ok-fg:#2F5D1B;
  --warn-bg:#FDE9CC; --warn-fg:#7A4300;
  --bad-bg:#FADAD6; --bad-fg:#9B1C13;
  --info-bg:#F0F0F0; --info-fg:#444;
  --bandeau:clamp(8px,2vw,24px);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:var(--eureden-police);color:var(--eureden-gris-fonce);background:var(--eureden-gris-clair);font-size:14px;line-height:1.45}
.bandeau{position:fixed;left:0;top:0;width:var(--bandeau);height:100vh;background:var(--eureden-jaune);z-index:20}
.app{margin-left:var(--bandeau);min-height:100vh;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
header.top{grid-column:1/3;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 20px}
.logo{display:flex;flex-direction:column;padding-right:18px;margin-right:4px;border-right:1px solid #ddd}
.logo b{font-size:22px;color:#000;letter-spacing:-.5px;font-weight:800}
.logo small{font-size:9px;letter-spacing:1.5px;color:var(--eureden-gris-fonce);text-transform:uppercase}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
select,input,button,textarea{font:inherit;color:inherit}
select,.ctl input{border:1px solid var(--eureden-gris);border-radius:6px;padding:6px 8px;background:#fff;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--eureden-gris);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.seg button[aria-pressed=true]{background:var(--eureden-jaune);color:#000}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.user{font-size:12px;text-align:right}
.user b{display:block;font-size:13px}
nav.side{background:#fff;border-right:1px solid #ddd;padding:12px 0}
nav.side button{display:flex;gap:10px;width:100%;align-items:center;border:0;background:none;padding:11px 20px;text-align:left;cursor:pointer;font-weight:600;font-size:14px;border-left:4px solid transparent}
nav.side button:hover{background:var(--eureden-gris-clair)}
nav.side button[aria-current=page]{background:var(--eureden-jaune-pale);border-left-color:var(--eureden-olive);font-weight:800;color:#000}
nav.side .ico{width:20px;text-align:center}
nav.side hr{border:0;border-top:1px solid #ddd;margin:10px 16px}
:focus-visible{outline:3px solid var(--eureden-olive);outline-offset:2px}
main{padding:22px 26px 60px;min-width:0}
h1{margin:0 0 2px;font-size:24px;color:#000;font-weight:800}
h1 .acc{font-family:var(--eureden-police-accent);font-size:32px;font-weight:600;color:var(--eureden-olive)}
.sub{margin:0 0 18px;color:var(--eureden-gris-fonce)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.08);min-width:0;margin-bottom:16px}
.grid > .card{margin-bottom:0}
.card h2{margin:0 0 10px;font-size:15px;color:#000;font-weight:800}
.card h2 small{font-weight:600;color:var(--eureden-gris-fonce);font-size:12px;margin-left:6px}
.kpi{border-top:6px solid var(--eureden-jaune)}
.kpi .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:800;color:#000;margin:2px 0}
.kpi .d{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-bad{background:var(--bad-bg);color:var(--bad-fg)}
.p-info{background:var(--info-bg);color:var(--info-fg)}
.p-brand{background:var(--eureden-jaune);color:#000}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #e6e6e6;font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--eureden-gris-clair);color:#000;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel td{background:var(--eureden-jaune-pale)}
tbody tr:hover td{background:#fafafa}
tr.tot td{font-weight:800;background:var(--eureden-gris-clair);color:#000}
tr.cliquable{cursor:pointer}
.scroll{overflow:auto;max-height:560px}
td input.cell{width:92px;text-align:right;border:1px solid var(--eureden-gris);border-radius:5px;padding:4px 6px;font-variant-numeric:tabular-nums;background:#fff}
td input.cell.changed{border-color:var(--eureden-olive);background:var(--eureden-jaune-pale);font-weight:800}
td input.cell[disabled]{background:var(--eureden-gris-clair);cursor:not-allowed}
.btn{border:1px solid #000;background:#fff;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--eureden-jaune);color:#000;border-color:#000}
.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.petit{padding:3px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee;align-items:flex-start}
.alert:last-child{border:0}
.tl{display:flex;gap:0;margin-top:6px;position:relative}
.tl div{flex:1;text-align:center;font-size:12px;padding-top:22px;position:relative}
.tl div::before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--eureden-gris)}
.tl div::after{content:"";position:absolute;top:0;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--eureden-olive)}
.tl div.cur::after{background:var(--eureden-jaune);border-color:#000}
.tl div.cur{font-weight:800;color:#000}
.tl div.cur::before{background:var(--eureden-jaune)}
.vt{border-left:4px solid var(--eureden-jaune);margin:0 0 0 8px;padding:0}
.vt li{list-style:none;padding:0 0 14px 16px;position:relative}
.vt li::before{content:"";position:absolute;left:-10px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--eureden-olive)}
.vt li.last::before{background:var(--eureden-jaune);border-color:#000}
.bar{height:10px;border-radius:5px;background:var(--eureden-gris-clair);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--eureden-vert)}
.note{font-size:12px;color:var(--eureden-gris-fonce)}
.liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.liste li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px}
label.ligne{display:inline;text-transform:none;font-weight:600;letter-spacing:0;margin:0}
.champs select,.champs input,.champs textarea,dialog select,dialog input,dialog textarea{width:100%;border:1px solid var(--eureden-gris);border-radius:6px;padding:7px 9px;background:#fff;font-weight:400;text-transform:none}
dialog{border:0;border-radius:10px;padding:20px 22px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:520px;width:92vw;font-family:inherit;color:var(--eureden-gris-fonce)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.toast{position:fixed;right:22px;bottom:22px;background:#000;color:#fff;padding:12px 18px;border-radius:8px;z-index:50;font-weight:700;max-width:90vw}
.bloc-etat{max-width:560px;margin:12vh auto;padding:0 20px}
.bloc-etat .card{border-top:6px solid var(--eureden-jaune)}
.vide{padding:18px;text-align:center;color:var(--eureden-gris-fonce);background:var(--eureden-gris-clair);border-radius:8px}
[hidden]{display:none !important}
@media (max-width:860px){.app{grid-template-columns:1fr}header.top{grid-column:1}nav.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #ddd;padding:0}nav.side button{white-space:nowrap;border-left:0;border-bottom:4px solid transparent}nav.side button[aria-current=page]{border-bottom-color:var(--eureden-olive)}nav.side hr{display:none}main{padding:16px 14px}}
@media print{.bandeau,nav.side,header.top .ctl,.btn{display:none}}
</style>

</head>
<body>
  <div class="bandeau" aria-hidden="true"></div>
  <div id="chargement" class="bloc-etat"><div class="card"><h1>Eureden S&amp;OP</h1><p class="sub">Chargement…</p></div></div>
  <div id="erreur" class="bloc-etat" hidden>
    <div class="card">
      <h1>Accès impossible</h1>
      <p id="erreur-message" class="sub"></p>
      <p class="note">Code : <span id="erreur-code"></span>. Si le problème persiste, contactez l'administrateur de l'application.</p>
      <button class="btn" id="erreur-retour" type="button">Réessayer</button>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="logo"><b>Eureden</b><small>S&amp;OP · Prévisions</small></div>
      <label class="ctl">Campagne<select id="camp"></select></label>
      <label class="ctl">Entité<select id="ent"></select></label>
      <div class="ctl">Unité
        <div class="seg" role="group" aria-label="Unité d'affichage" id="unites">
          <button type="button" aria-pressed="true" data-u="Q">Quantité</button>
          <button type="button" aria-pressed="false" data-u="H">Hectares</button>
          <button type="button" aria-pressed="false" data-u="E">Valeur €</button>
          <button type="button" disabled title="Disponible avec le catalogue des produits (poids des articles)">Tonnes</button>
        </div>
      </div>
      <div class="spacer"></div>
      <span id="entete-statut" class="pill p-info"></span>
      <div class="user"><b id="entete-utilisateur"></b><span id="entete-roles"></span></div>
    </header>
    <nav class="side" id="menu" aria-label="Navigation principale"></nav>
    <main id="contenu"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
(function () {
  'use strict';
  var App = window.App = { vues: {}, cache: {}, etat: { session: null, ecran: 'dashboard', campagne: '', entite: '', unite: 'Q', redessiner: null } };
  var $ = App.$ = function (s, r) { return (r || document).querySelector(s); };
  App.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var esc = App.esc = function (v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  // ---------- Formats et unités ----------
  var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  App.n0 = function (v) { return nf.format(Math.round(v || 0)); };
  App.pct = function (v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + ' %'; };
  // Unité d'affichage : Q quantité (unités de stock), H hectares, E valeur HT.
  App.UNITES = { Q: { cle: 'q', lbl: 'Quantité', suf: '' }, H: { cle: 'ha', lbl: 'Hectares', suf: ' ha' }, E: { cle: 'eur', lbl: 'Valeur €', suf: ' €' } };
  App.fmt = function (v) { return nf.format(Math.round(v || 0)) + App.UNITES[App.etat.unite].suf; };
  // Valeur d'un article dans l'unité choisie. champ : n1, statistique, evenements, correction, substitution, retenue.
  App.valArt = function (a, champ) {
    var u = App.etat.unite;
    if (champ === 'n1') return u === 'Q' ? a.n1 : (u === 'H' ? a.n1ha : a.n1eur);
    return a[champ] * (u === 'Q' ? 1 : (u === 'H' ? a.rh : a.re));
  };
  // Totaux de l'entité filtrée (ou de toutes), dans l'unité choisie.
  App.totaux = function (liste) {
    var ent = App.etat.entite, cle = App.UNITES[App.etat.unite].cle;
    var t = { articles: 0, n1: 0, statistique: 0, evenements: 0, correction: 0, substitution: 0, retenue: 0 };
    (liste || []).forEach(function (x) {
      if (ent && x.entite !== ent) return;
      t.articles += x.articles;
      Object.keys(t).forEach(function (k) { if (k !== 'articles') t[k] += x[cle][k]; });
    });
    return t;
  };
  App.pill = function (classe, texte, symbole) {
    return '<span class="pill p-' + classe + '"><span aria-hidden="true">' + (symbole || '') + '</span>' + esc(texte) + '</span>';
  };
  App.variation = function (a, b) {
    if (!b) return a ? App.pill('info', 'Nouveau', '●') : '';
    var p = (a - b) / Math.abs(b) * 100;
    var seuil = (App.etat.session && App.etat.session.seuilEcart) || 15;
    return App.pill(Math.abs(p) > seuil ? 'warn' : 'info', App.pct(p), p >= 0 ? '▲' : '▼');
  };
  App.TYPES_VERSION = { PREV_TC: 'Prévision TC', STATISTIQUE: 'Statistique', ARBITREE: 'Arbitrée', VALIDEE: 'Validée' };
  App.typeVersion = function (t) { return App.TYPES_VERSION[t] || t; };
  App.NIVEAUX = { ERREUR: ['bad', '✖'], ATTENTION: ['warn', '⚠'], INFO: ['info', 'ℹ'], OK: ['ok', '✓'] };

  App.idOperation = function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'op-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  };

  App.toast = function (texte) {
    var t = $('#toast');
    t.textContent = texte; t.hidden = false;
    clearTimeout(App.toast.t); App.toast.t = setTimeout(function () { t.hidden = true; }, 4000);
  };

  // ---------- Appels serveur ----------
  // Renvoie { ok, data } ou { ok: false, code, message }. La campagne choisie accompagne chaque appel.
  App.appel = function (nom, args) {
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function () { resolve({ ok: false, code: 'RESEAU', message: 'Le serveur ne répond pas. Vérifiez votre connexion et réessayez.' }); })
        .api(nom, args || [], App.etat.campagne || '');
    });
  };
  // Lecture avec mémoire : une même donnée n'est demandée qu'une fois jusqu'à la prochaine écriture.
  App.donnees = function (nom, args) {
    var k = nom + '|' + JSON.stringify(args || []);
    if (!App.cache[k]) {
      App.cache[k] = App.appel(nom, args).then(function (r) { if (!r.ok) delete App.cache[k]; return r; });
    }
    return App.cache[k];
  };
  App.invalider = function () { App.cache = {}; };

  App.erreur = function (cible, r) {
    cible.innerHTML = '<div class="card"><h2>Données indisponibles</h2><p>' + esc(r.message) + '</p><p class="note">Code : ' + esc(r.code) + '</p></div>';
  };

  // ---------- Boîte de dialogue ----------
  // options : { titre, corps (html), ok (libellé), surOk: function () -> Promise<{ok,message}> | undefined }
  App.dialogue = function (o) {
    var d = $('#dlg');
    d.innerHTML = '<h2 style="margin:0 0 4px;color:#000">' + esc(o.titre) + '</h2><div class="champs">' + o.corps + '</div><p class="note" id="dlg-msg" role="status" style="color:#9B1C13"></p>' +
      '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" type="button" id="dlg-non">Annuler</button><button class="btn pri" type="button" id="dlg-ok">' + esc(o.ok || 'Valider') + '</button></div>';
    $('#dlg-non').onclick = function () { d.close(); };
    $('#dlg-ok').onclick = function () {
      var b = $('#dlg-ok'); b.disabled = true; $('#dlg-msg').textContent = '';
      Promise.resolve(o.surOk ? o.surOk() : { ok: true }).then(function (r) {
        b.disabled = false;
        if (r && r.ok === false) { $('#dlg-msg').textContent = r.message || 'Action impossible.'; return; }
        d.close();
      });
    };
    d.showModal();
    var premier = d.querySelector('input,select,textarea'); if (premier) premier.focus();
  };

  // ---------- Export ----------
  // Fichier CSV lisible par Excel (séparateur point-virgule, accents conservés). lignes : tableau de tableaux.
  App.telecharger = function (nom, lignes) {
    var cel = function (v) { var t = String(v === null || v === undefined ? '' : v); return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    var csv = '﻿' + lignes.map(function (l) { return l.map(cel).join(';'); }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  // ---------- Graphique en barres groupées ----------
  // series : [{ nom, couleur, valeurs: [] }], categories : []. Valeurs déjà dans l'unité d'affichage.
  App.barres = function (categories, series, hauteur) {
    var h = hauteur || 240, w = 620, pl = 56, pb = 26, pt = 10;
    var max = Math.max.apply(null, [1].concat.apply([], series.map(function (s) { return s.valeurs; }))) * 1.1;
    var bw = (w - pl) / Math.max(1, categories.length);
    var y = function (v) { return pt + (h - pt - pb) * (1 - v / max); };
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="Graphique en barres">';
    for (var i = 0; i <= 4; i++) {
      var v = max * i / 4;
      s += '<line x1="' + pl + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e3e3e3"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="#444">' + nf.format(Math.round(v)) + '</text>';
    }
    var largeur = bw * 0.76 / series.length;
    categories.forEach(function (c, k) {
      var x = pl + k * bw;
      series.forEach(function (se, j) {
        var val = se.valeurs[k] || 0;
        s += '<rect x="' + (x + bw * 0.12 + j * largeur) + '" y="' + y(val) + '" width="' + (largeur - 2) + '" height="' + Math.max(0, h - pb - y(val)) + '" fill="' + se.couleur + '"><title>' + esc(se.nom + ' : ' + nf.format(Math.round(val))) + '</title></rect>';
      });
      s += '<text x="' + (x + bw / 2) + '" y="' + (h - 8) + '" font-size="10" text-anchor="middle" fill="#444">' + esc(c) + '</text>';
    });
    return s + '</svg>';
  };
  App.legende = function (series) {
    return '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.couleur + '"></i>' + esc(s.nom) + '</span>'; }).join('') + '</div>';
  };

  // ---------- Navigation ----------
  var MENU = [
    ['dashboard', '▦', 'Tableau de bord'], ['prevision', '✎', 'Prévision & arbitrage'], ['historique', '⟲', 'Historique & substitutions'],
    ['cadencage', '▤', 'Cadençage'], ['stocks', '▣', 'Projection des stocks'], ['versions', '✓', 'Versions & fiabilité'], '---',
    ['sources', '⛁', 'Sources de données'], ['controles', '⚙', 'Contrôles de mise en service']
  ];

  App.afficher = function (nom) {
    var s = App.etat.session;
    if (nom === 'controles' && !s.droits.configuration) nom = 'dashboard';
    App.etat.ecran = nom; App.etat.redessiner = null;
    $('#menu').innerHTML = MENU.filter(function (m) { return m === '---' || m[0] !== 'controles' || s.droits.configuration; }).map(function (m) {
      return m === '---' ? '<hr>' : '<button type="button" data-v="' + m[0] + '"' + (m[0] === nom ? ' aria-current="page"' : '') + '><span class="ico" aria-hidden="true">' + m[1] + '</span>' + esc(m[2]) + '</button>';
    }).join('');
    App.$$('#menu button').forEach(function (b) { b.onclick = function () { App.afficher(b.getAttribute('data-v')); }; });
    var c = $('#contenu');
    c.innerHTML = '<div class="card">Chargement…</div>';

    function appliquee(a) { return a.correction; }

        if (!rs[1].ok) { App.erreur(c, rs[1]); return; }
        etat.d = rs[0].data; etat.aj = rs[1].data; dessiner();
      });
    }

    function brancherStat() {
      var b = c.querySelector('#p-stat');
      if (!b) return;
      b.onclick = function () {
        App.dialogue({
          titre: 'Recalculer la statistique', ok: 'Recalculer',
          corps: '<p>Une nouvelle version « Statistique » remplace la prévision courante. Vos corrections, événements, arrêts et substitutions restent enregistrés mais ne comptent plus tant que vous n\'avez pas enregistré une reprévision.</p><p class="note">Pondération des années : réglage PONDERATION_ANNEES. Le calcul peut durer une minute.</p>',
          surOk: function () {
            return App.appel('calculerStatistique', [{}, App.idOperation()]).then(function (r) {
              if (!r.ok) return r;
              etat.modif = {}; App.toast('Version ' + r.data.resultat.idVersion + ' créée (' + r.data.resultat.lignes + ' lignes).'); recharger();
              return r;
            });
          }
        });
      };
    }

    function brancher() {
      brancherStat();
      App.$$('[data-m]', c).forEach(function (b) { b.onclick = function () { etat.mode = b.getAttribute('data-m'); dessiner(); }; });
      c.querySelector('#p-q').oninput = function (e) { etat.q = e.target.value; majTable(); };
      c.querySelector('#p-seul').onchange = function (e) { etat.seulement = e.target.checked; majTable(); };
      c.querySelector('#p-csv').onclick = exporter;
      var evt = c.querySelector('#p-evt'); if (evt) evt.onclick = function () { dialogueEvenement(); };
      var sv = c.querySelector('#p-save'); if (sv) sv.onclick = dialogueEnregistrer;
      brancherTable();
      brancherDetail();

    function majTable() {
      c.querySelector('#p-table').innerHTML = tableau();
      brancherTable();

    function brancherTable() {
      App.$$('#p-table input.cell', c).forEach(function (i) {
        i.onclick = function (e) { e.stopPropagation(); };
        i.onchange = function () {
          var k = i.getAttribute('data-k'), a = etat.d.articles.filter(function (x) { return cle(x) === k; })[0];
          var brut = i.value.trim().replace(/\s/g, '').replace(',', '.');
          var v = brut === '' ? 0 : Number(brut);
          if (isNaN(v)) { App.toast('Valeur non numérique : ' + i.value); i.value = valeurCellule(a); return; }

          dessiner();

    function brancherDetail() {
      App.$$('[data-annuler]', c).forEach(function (b) {
        b.onclick = function () {
          App.dialogue({
            titre: 'Annuler la saisie ' + b.getAttribute('data-annuler'), ok: 'Annuler la saisie',
            corps: '<p>La saisie n\'aura plus d\'effet à la prochaine reprévision. Elle reste dans le journal.</p>',
            surOk: function () {
              return App.appel('annulerAjustement', [b.getAttribute('data-nature'), b.getAttribute('data-annuler'), App.idOperation()]).then(function (r) {
                if (!r.ok) return r;
                App.toast('Saisie annulée. Enregistrez la reprévision pour l\'appliquer.'); recharger(); return r;
              });
            }
          });
        };
      });
    }

    function dialogueEnregistrer() {
      var cles = Object.keys(etat.modif);
      var items = cles.map(function (k) {
        var a = etat.d.articles.filter(function (x) { return cle(x) === k; })[0], m = etat.modif[k];
        return { entite: a.entite, code: a.code, quantite: m.quantite !== undefined ? (m.quantite ? +m.quantite.toFixed(3) : '') : '', pourcent: m.pourcent !== undefined ? (m.pourcent || '') : '' };
      });
      var impact = cles.reduce(function (s, k) {
        var a = etat.d.articles.filter(function (x) { return cle(x) === k; })[0];
        return s + (nouvelle(a) - appliquee(a)) * (App.etat.unite === 'Q' ? 1 : ratio(a));
      }, 0);
      App.dialogue({
        titre: 'Enregistrer la reprévision', ok: 'Créer la version',
        corps: '<p class="note">' + cles.length + ' article(s) modifié(s) · impact net ' + (impact >= 0 ? '+' : '−') + App.fmt(Math.abs(impact)) + '. Les événements, arrêts et substitutions actifs sont appliqués en même temps.</p>' +
          '<label for="d-motif">Motif</label><select id="d-motif">' + MOTIFS.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select>' +
          '<label for="d-com">Commentaire</label><textarea id="d-com" rows="3" placeholder="Obligatoire pour la traçabilité"></textarea>',
        surOk: function () {

          return App.appel('reprevision', [{ corrections: items, motif: $v('#d-motif'), commentaire: com }, App.idOperation()]).then(function (r) {
            if (!r.ok) return r;
            var res = r.data.resultat;
            etat.modif = {};
            App.toast('Version ' + res.idVersion + ' enregistrée (' + res.corrigees + ' correction(s)).' + (res.avertissements && res.avertissements.length ? ' ' + res.avertissements[0] : ''));
            recharger();
            return r;
          });
        }
      });
    }

    function dialogueEvenement() {
      var a = etat.d.articles.filter(function (x) { return cle(x) === etat.sel; })[0];
      var ents = App.etat.session.entites;
      App.dialogue({
        titre: 'Ajouter un événement commercial', ok: 'Enregistrer',
        corps: '<label for="e-type">Type</label><select id="e-type">' + TYPES_EVT.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select>' +
          '<label for="e-ent">Entité</label><select id="e-ent">' + ents.map(function (e) { return '<option' + (a && a.entite === e ? ' selected' : '') + '>' + esc(e) + '</option>'; }).join('') + '</select>' +
          '<label for="e-code">Code produit</label><input id="e-code" value="' + esc(a ? a.code : '') + '">' +
          '<label for="e-qte">Quantité (+ ou −, en unités de stock)</label><input id="e-qte" inputmode="decimal">' +
          '<label for="e-pct">ou pourcentage de la statistique</label><input id="e-pct" inputmode="decimal">' +
          '<label for="e-com">Commentaire</label><input id="e-com" maxlength="200">' +
          '<p class="note">L\'événement compte à la prochaine reprévision.</p>',
        surOk: function () {
          return App.appel('ajouterAjustement', [{ nature: 'EVENEMENT', type: $v('#e-type'), entite: $v('#e-ent'), code: $v('#e-code'), quantite: $v('#e-qte'), pourcent: $v('#e-pct'), commentaire: $v('#e-com') }, App.idOperation()]).then(function (r) {
            if (!r.ok) return r;
            App.toast('Événement ' + r.data.resultat.id + ' enregistré.' + (r.data.resultat.avertissement ? ' ' + r.data.resultat.avertissement : ''));
            recharger(); return r;
          });
        }
      });
    }

    function exporter() {
      var ref = etat.d.anneeReference || 'N-1';
      var lignes = [['Code', 'Libellé', 'Entité', 'Réalisé ' + ref, 'Statistique', 'Événements', 'Corrections', 'Substitutions', 'Retenue', 'Unité']];
      articlesVisibles().forEach(function (a) {
        lignes.push([a.code, a.libelle, a.entite].concat(['n1', 'statistique', 'evenements', 'correction', 'substitution', 'retenue'].map(function (k) { return Math.round(App.valArt(a, k) * 100) / 100; })).concat([App.UNITES[App.etat.unite].lbl]));
      });
      App.telecharger('prevision-' + App.etat.session.campagne.id + '.csv', lignes);
    }

    function $v(sel) { var e = document.querySelector('#dlg ' + sel); return e ? e.value.trim() : ''; }

    App.etat.redessiner = dessiner;
    recharger();
  };
})();
</script>

  <script>
(function () {
  'use strict';
  var App = window.App, esc = App.esc;
  var MOTIFS_SUB = [['REMPLACEMENT', 'Remplacement'], ['REGLEMENTAIRE', 'Réglementaire'], ['AUTRE', 'Autre']];

  App.vues.historique = function (c) {
    var etat = { h: null, aj: null, q: '' };
    var droits = App.etat.session.droits;
    var ouverte = ['GELEE', 'CLOTUREE'].indexOf(App.etat.session.campagne.statut) < 0;
    var peutSaisir = ouverte && (droits.validationGamme || droits.arbitrage);

    // Quantité, hectares ou montant d'un article pour une année, selon l'unité choisie.

    function tableHisto() {

        return (!ent || a.entite === ent) && (!q || a.code.toLowerCase().indexOf(q) >= 0 || a.libelle.toLowerCase().indexOf(q) >= 0);
      });
      var derniere = an[an.length - 1], avant = an.length > 1 ? an[an.length - 2] : null;
      var cles = { Q: 'qte', H: 'ha', E: 'mt' }[App.etat.unite];
      var corps = sel.slice(0, 200).map(function (a) {
        var l = valeur(a.parAnnee[derniere]) || 0, b = avant ? (valeur(a.parAnnee[avant]) || 0) : 0;
        return '<tr><td>' + esc(a.code) + '</td><td>' + esc(a.libelle) + '</td><td>' + esc(a.entite) + '</td>' + an.map(function (y) {
          var v = valeur(a.parAnnee[y]); return '<td class="n">' + (v === null ? '–' : App.fmt(v)) + '</td>';
        }).join('') + (avant ? '<td>' + App.variation(l, b) + '</td>' : '') + '</tr>';
      }).join('');
      return (sel.length ? '<table><thead><tr><th>Code</th><th>Libellé</th><th>Entité</th>' + an.map(function (y) { return '<th class="n">' + esc(App.UNITES[App.etat.unite].lbl) + ' ' + esc(y) + '</th>'; }).join('') + (avant ? '<th>' + esc(derniere) + ' vs ' + esc(avant) + '</th>' : '') + '</tr></thead><tbody>' + corps + '</tbody></table>' : '<div class="vide">Aucun article ne correspond.</div>') +
        '<p class="note">' + sel.length + ' article(s)' + (sel.length > 200 ? ', 200 affichés : affinez la recherche' : '') + (h.tronque ? ' · ' + h.nbArticles + ' articles au total, les ' + h.articles.length + ' premiers par montant ' + esc(derniere) + ' sont chargés' : '') + ' · colonne ' + cles + '.</p>';
    }

    function totaux() {
      var h = etat.h, ent = App.etat.entite;
      var lignes = h.totaux.filter(function (t) { return !ent || t.entite === ent; });
      return '<table><thead><tr><th>Entité</th><th>Année</th><th class="n">Articles</th><th class="n">TC</th><th class="n">Quantité</th><th class="n">Hectares</th><th class="n">Montant HT</th></tr></thead><tbody>' +
        lignes.map(function (t) { return '<tr><td>' + esc(t.entite) + '</td><td>' + esc(t.annee) + '</td><td class="n">' + App.n0(t.articles) + '</td><td class="n">' + App.n0(t.tc) + '</td><td class="n">' + App.n0(t.qte) + '</td><td class="n">' + App.n0(t.ha) + '</td><td class="n">' + App.n0(t.montant) + ' €</td></tr>'; }).join('') + '</tbody></table>' +
        '<p class="note">La quantité additionne des unités de stock différentes (sacs, bidons, kg).</p>';
    }

    function tableSubstitutions() {
      var l = etat.aj.substitutions;
      if (!l.length) return '<div class="vide">Aucun arrêt ni substitution actif.</div>';
      return '<table><thead><tr><th>Numéro</th><th>Nature</th><th>Article remplacé</th><th></th><th>Remplaçant</th><th>Entité</th><th class="n">Taux</th><th>Période</th><th>Commentaire</th><th></th></tr></thead><tbody>' + l.map(function (x) {

          (peutSaisir ? '<button class="btn petit" type="button" data-annuler="' + esc(x.id) + '">Annuler</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    }

    function dessiner() {
      if (!etat.h || !etat.aj) return;
      var ref = etat.h.annees.join(', ');
      c.innerHTML = '<h1>Historique &amp; substitutions</h1><p class="sub">Fiabiliser l\'historique avant de prévoir : arrêts de produit et remplacements d\'articles. Années lues : ' + esc(ref) + '.</p>' +
        '<div class="card"><h2>Ventes réalisées <small>par entité et par année</small></h2><div class="scroll" style="max-height:260px">' + totaux() + '</div></div>' +
        '<div class="card"><h2>Table de substitution <small>arrêts de produit et remplacements, valables pour toutes les campagnes</small></h2><div class="scroll" style="max-height:300px" id="h-subs">' + tableSubstitutions() + '</div>' +
        (peutSaisir ? '<div class="row" style="margin-top:10px"><button class="btn pri" id="h-arret" type="button">+ Arrêt de produit</button><button class="btn pri" id="h-sub" type="button">+ Substitution</button><span class="note">Effet à la prochaine reprévision. Pas de chaînage : un report ne se répercute pas sur un autre report.</span></div>' : '<p class="note">Votre rôle ne permet pas de saisir d\'arrêt ni de substitution.</p>') + '</div>' +
        '<div class="card"><h2>Historique par article</h2><div class="row" style="margin-bottom:10px"><label class="ctl" style="margin:0">Rechercher<input id="h-q" type="search" maxlength="60" value="' + esc(etat.q) + '" placeholder="code ou libellé"></label></div><div class="scroll" id="h-table">' + tableHisto() + '</div></div>';
      c.querySelector('#h-q').oninput = function (e) { etat.q = e.target.value; c.querySelector('#h-table').innerHTML = tableHisto(); };
      var a = c.querySelector('#h-arret'); if (a) a.onclick = function () { dialogue('ARRET'); };
      var s = c.querySelector('#h-sub'); if (s) s.onclick = function () { dialogue('SUBSTITUTION'); };
      App.$$('[data-annuler]', c).forEach(function (b) {
        b.onclick = function () {
          App.dialogue({
            titre: 'Annuler ' + b.getAttribute('data-annuler'), ok: 'Annuler la saisie',
            corps: '<p>L\'arrêt ou la substitution est désactivé (Actif = NON dans l\'onglet SUBSTITUTIONS). Il n\'aura plus d\'effet à la prochaine reprévision.</p>',
            surOk: function () {
              return App.appel('annulerAjustement', ['SUBSTITUTION', b.getAttribute('data-annuler'), App.idOperation()]).then(function (r) {
                if (!r.ok) return r; App.toast('Saisie annulée.'); recharger(); return r;
              });
            }
          });
        };
      });
    }

    function dialogue(nature) {
      var ents = App.etat.session.entites;
      var champ = function (id, lib, extra) { return '<label for="s-' + id + '">' + lib + '</label><input id="s-' + id + '" ' + (extra || '') + '>'; };
      var corps = champ('ancien', nature === 'ARRET' ? 'Code du produit arrêté' : 'Code de l\'ancien produit') +
        (nature === 'SUBSTITUTION' ? champ('nouveau', 'Code du nouveau produit') : '') +
        '<label for="s-ent">Entité</label><select id="s-ent"><option value="">Toutes</option>' + ents.map(function (e) { return '<option>' + esc(e) + '</option>'; }).join('') + '</select>' +
        champ('taux', nature === 'ARRET' ? 'Part retirée, % (100 par défaut)' : 'Part reportée, % (100 par défaut)', 'inputmode="decimal"') +
        (nature === 'SUBSTITUTION' ? '<label for="s-motif">Motif</label><select id="s-motif">' + MOTIFS_SUB.map(function (m) { return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') + '</select>' : '') +
        champ('de', 'Date d\'effet (facultatif)', 'type="date"') + champ('df', 'Date de fin (facultatif)', 'type="date"') + champ('com', 'Commentaire', 'maxlength="200"');
      App.dialogue({
        titre: nature === 'ARRET' ? 'Arrêt de produit' : 'Substitution', ok: 'Enregistrer', corps: corps,
        surOk: function () {

          return App.appel('ajouterAjustement', [{ nature: nature, ancien: g('ancien'), nouveau: g('nouveau'), entite: g('ent'), taux: g('taux'), motif: g('motif'), dateEffet: g('de'), dateFin: g('df'), commentaire: g('com') }, App.idOperation()]).then(function (r) {
            if (!r.ok) return r;
            App.toast('Saisie ' + r.data.resultat.id + ' enregistrée.' + (r.data.resultat.avertissement ? ' ' + r.data.resultat.avertissement : ''));
            recharger(); return r;
          });
        }
      });
    }

    function recharger() {
      App.invalider();

        if (App.etat.ecran !== 'historique') return;

        etat.h = rs[0].data; etat.aj = rs[1].data; dessiner();
      });
    }

    App.etat.redessiner = dessiner;
    recharger();
  };
})();

(function () {

        var action = !v.verrouillee && v.statut === 'COURANTE' && droits.validation && ouverte ? ' <button class="btn petit" type="button" data-verrou="' + esc(v.id) + '">Verrouiller</button>' : '';
        return '<li class="' + (i === 0 ? 'last' : '') + '"><b>' + esc(v.id) + ' · ' + esc(App.typeVersion(v.type)) + '</b> ' + statut + verrou + action + '<br><span class="note">' + esc(v.libelle) + '<br>' + esc(v.creeLe.replace('T', ' ')) + ' · ' + esc(v.creePar) + (v.commentaire ? '<br>' + esc(v.commentaire) : '') + '</span></li>';

        '<div class="card"><h2>Fiabilité de la méthode</h2>' + fiabilite() + '</div></div>';
      App.$$('[data-verrou]', c).forEach(function (b) {
        b.onclick = function () {
          App.dialogue({
            titre: 'Verrouiller la version ' + b.getAttribute('data-verrou'), ok: 'Verrouiller',
            corps: '<p>Une version verrouillée ne peut plus être remplacée ni recalculée. Cette action est définitive.</p>',
            surOk: function () {
              return App.appel('verrouillerVersion', [b.getAttribute('data-verrou'), App.idOperation()]).then(function (r) {
                if (!r.ok) return r; App.toast('Version verrouillée.'); recharger(); return r;
              });
            }
          });
        };
      });
      var e = c.querySelector('#v-essai');
      if (e) e.onclick = function () {
        e.disabled = true; c.querySelector('#v-essai-msg').textContent = 'Test en cours…';
        App.donnees('essaiPonderation').then(function (r) {
          if (!r.ok) { e.disabled = false; c.querySelector('#v-essai-msg').textContent = r.message; return; }
          etat.fiab = r.data; dessiner();
        });
      };
    }

    function recharger() {
      App.invalider();
      return App.donnees('versions').then(function (r) {
        if (App.etat.ecran !== 'versions') return;
        if (!r.ok) { App.erreur(c, r); return; }
        etat.v = r.data; dessiner();
      });
    }
    App.etat.redessiner = dessiner;
    recharger();
  };

  // ---------- Sources de données ----------
  var ETATS = {
    OK: ['ok', 'Connectée', '✓'], ERREUR: ['bad', 'Erreur', '✖'], A_CONNECTER: ['warn', 'À connecter', '⚠'],
    INACTIF: ['info', 'Inactive', '●'], AUTRE_CAMPAGNE: ['info', 'Autre campagne', '●']
  };
  App.vues.sources = function (c) {
    App.donnees('sources').then(function (r) {
      if (App.etat.ecran !== 'sources') return;
      if (!r.ok) { App.erreur(c, r); return; }
      var d = r.data;
      var lignes = d.sources.map(function (s) {
        var e = ETATS[s.etat] || ETATS.ERREUR;
        var contenu = [s.entite, s.pac].filter(Boolean).join(' · ');
        return '<tr><td><b>' + esc(s.libelle) + '</b><br><span class="note">' + esc(s.id) + '</span></td><td>' + esc(contenu) + '</td><td>' + esc(s.alimentation || 'Lecture en direct') + '</td><td class="n">' + (s.lignes !== undefined ? App.n0(s.lignes) : '–') + '</td><td>' + App.pill(e[0], e[1], e[2]) + '<br><span class="note">' + esc(s.detail) + '</span></td><td>' + (s.lien ? '<a href="' + esc(s.lien) + '" target="_blank" rel="noopener">Ouvrir</a>' : '') + '</td></tr>';
      }).join('');
      c.innerHTML = '<h1>Sources de données</h1><p class="sub">L\'application lit et écrit dans des Google Sheets, alimentés de façons diverses.</p>' +
        '<div class="card"><div class="scroll"><table><thead><tr><th>Source</th><th>Contenu</th><th>Alimentation</th><th class="n">Lignes</th><th>État</th><th></th></tr></thead><tbody>' + (lignes || '<tr><td colspan="6" class="note">Aucune source déclarée dans SOURCES.</td></tr>') + '</tbody></table></div>' +
        '<p class="note" style="margin-top:10px">Principe : les fichiers « entrées » (ventes, stocks, budget) sont en lecture seule dans l\'application ; les fichiers « sorties » (versions, prévision, corrections, journal) sont écrits par l\'application. Une source se déclare dans l\'onglet SOURCES des paramètres.</p></div>' +
        (d.fichiers.length ? '<div class="card"><h2>Fichiers de l\'application</h2><ul class="liste">' + d.fichiers.map(function (f) { return '<li><b>' + esc(f.nom) + '</b> <a href="' + esc(f.lien) + '" target="_blank" rel="noopener">Ouvrir</a></li>'; }).join('') + '</ul></div>' : '');
    });
  };

  // ---------- Contrôles de mise en service ----------
  App.vues.controles = function (c) {
    c.innerHTML = '<h1>Contrôles de mise en service</h1><p class="sub">Vérifie les classeurs, la campagne, les accès et les sources avant l\'ouverture.</p>' +
      '<div class="card"><div class="row"><button class="btn pri" id="c-lancer" type="button">Lancer les contrôles</button><span id="c-etat" class="note" role="status"></span></div><div id="c-res" style="margin-top:12px"></div></div>';
    c.querySelector('#c-lancer').onclick = function () {
      var b = c.querySelector('#c-lancer'); b.disabled = true; c.querySelector('#c-etat').textContent = 'Contrôle en cours…';
      App.appel('controles', []).then(function (r) {
        b.disabled = false; c.querySelector('#c-etat').textContent = '';
        if (!r.ok) { c.querySelector('#c-res').innerHTML = '<p>' + esc(r.message) + '</p>'; return; }
        c.querySelector('#c-res').innerHTML = '<div class="scroll"><table><thead><tr><th>Résultat</th><th>Sujet</th><th>Détail</th></tr></thead><tbody>' + r.data.map(function (x) {
          var n = App.NIVEAUX[x.niveau] || App.NIVEAUX.ATTENTION;
          return '<tr><td>' + App.pill(n[0], x.niveau, n[1]) + '</td><td>' + esc(x.sujet) + '</td><td>' + esc(x.detail) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      });
    };
  };
})();
</script>

  <script>App.demarrer();</script>
</body>
</html>
