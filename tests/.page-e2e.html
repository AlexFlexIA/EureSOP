<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Eureden S&amp;OP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
:root{
  /* Charte Eureden : variables numériques. Interface claire, texte foncé, couleur en surface et en repère. */
  --eureden-noir:#000; --eureden-blanc:#fff; --eureden-jaune:#E8E22F;
  --eureden-jaune-vif:#F1EC42; --eureden-jaune-pale:#F8F5A7; --eureden-olive:#514F21;
  --eureden-gris-fonce:#444; --eureden-gris:#8A8A8A; --eureden-gris-clair:#F0F0F0;
  --eureden-vert-clair:#BAD264; --eureden-vert:#84BD66;
  --eureden-police:'Nunito Sans',Arial,sans-serif; --eureden-police-accent:'Caveat',cursive;
  /* Couleurs d'état : jamais le jaune de marque pour une alerte */
  --ok-bg:#E3F1DA; --ok-fg:#2F5D1B;
  --warn-bg:#FDE9CC; --warn-fg:#7A4300;
  --bad-bg:#FADAD6; --bad-fg:#9B1C13;
  --info-bg:#F0F0F0; --info-fg:#444;
  --bandeau:clamp(8px,2vw,24px);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:var(--eureden-police);color:var(--eureden-gris-fonce);background:var(--eureden-gris-clair);font-size:14px;line-height:1.45}
.bandeau{position:fixed;left:0;top:0;width:var(--bandeau);height:100vh;background:var(--eureden-jaune);z-index:20}
.app{margin-left:var(--bandeau);min-height:100vh;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
header.top{grid-column:1/3;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 20px}
.logo{display:flex;flex-direction:column;padding-right:18px;margin-right:4px;border-right:1px solid #ddd}
.logo b{font-size:22px;color:#000;letter-spacing:-.5px;font-weight:800}
.logo small{font-size:9px;letter-spacing:1.5px;color:var(--eureden-gris-fonce);text-transform:uppercase}
.ctl{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
select,input,button,textarea{font:inherit;color:inherit}
select,.ctl input{border:1px solid var(--eureden-gris);border-radius:6px;padding:6px 8px;background:#fff;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--eureden-gris);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.seg button[aria-pressed=true]{background:var(--eureden-jaune);color:#000}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.user{font-size:12px;text-align:right}
.user b{display:block;font-size:13px}
nav.side{background:#fff;border-right:1px solid #ddd;padding:12px 0}
nav.side button{display:flex;gap:10px;width:100%;align-items:center;border:0;background:none;padding:11px 20px;text-align:left;cursor:pointer;font-weight:600;font-size:14px;border-left:4px solid transparent}
nav.side button:hover{background:var(--eureden-gris-clair)}
nav.side button[aria-current=page]{background:var(--eureden-jaune-pale);border-left-color:var(--eureden-olive);font-weight:800;color:#000}
nav.side .ico{width:20px;text-align:center}
nav.side hr{border:0;border-top:1px solid #ddd;margin:10px 16px}
:focus-visible{outline:3px solid var(--eureden-olive);outline-offset:2px}
main{padding:22px 26px 60px;min-width:0}
h1{margin:0 0 2px;font-size:24px;color:#000;font-weight:800}
h1 .acc{font-family:var(--eureden-police-accent);font-size:32px;font-weight:600;color:var(--eureden-olive)}
.sub{margin:0 0 18px;color:var(--eureden-gris-fonce)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.08);min-width:0;margin-bottom:16px}
.grid > .card{margin-bottom:0}
.card h2{margin:0 0 10px;font-size:15px;color:#000;font-weight:800}
.card h2 small{font-weight:600;color:var(--eureden-gris-fonce);font-size:12px;margin-left:6px}
.kpi{border-top:6px solid var(--eureden-jaune)}
.kpi .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:800;color:#000;margin:2px 0}
.kpi .d{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-bad{background:var(--bad-bg);color:var(--bad-fg)}
.p-info{background:var(--info-bg);color:var(--info-fg)}
.p-brand{background:var(--eureden-jaune);color:#000}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #e6e6e6;font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--eureden-gris-clair);color:#000;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .pill{font-size:11px;padding:2px 7px}
tr.sel td{background:var(--eureden-jaune-pale)}
tbody tr:hover td{background:#fafafa}
tr.tot td{font-weight:800;background:var(--eureden-gris-clair);color:#000}
tr.cliquable{cursor:pointer}
.scroll{overflow:auto;max-height:560px}
td input.cell{width:84px;text-align:right;border:1px solid var(--eureden-gris);border-radius:5px;padding:4px 6px;font-variant-numeric:tabular-nums;background:#fff}
td input.cell.changed{border-color:var(--eureden-olive);background:var(--eureden-jaune-pale);font-weight:800}
td input.cell[disabled]{background:var(--eureden-gris-clair);cursor:not-allowed}
.btn{border:1px solid #000;background:#fff;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--eureden-jaune);color:#000;border-color:#000}
.btn:hover{filter:brightness(.96)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.petit{padding:3px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee;align-items:flex-start}
.alert:last-child{border:0}
.tl{display:flex;gap:0;margin-top:6px;position:relative}
.tl div{flex:1;text-align:center;font-size:12px;padding-top:22px;position:relative}
.tl div::before{content:"";position:absolute;top:6px;left:0;right:0;height:4px;background:var(--eureden-gris)}
.tl div::after{content:"";position:absolute;top:0;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--eureden-olive)}
.tl div.cur::after{background:var(--eureden-jaune);border-color:#000}
.tl div.cur{font-weight:800;color:#000}
.tl div.cur::before{background:var(--eureden-jaune)}
.vt{border-left:4px solid var(--eureden-jaune);margin:0 0 0 8px;padding:0}
.vt li{list-style:none;padding:0 0 14px 16px;position:relative}
.vt li::before{content:"";position:absolute;left:-10px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--eureden-olive)}
.vt li.last::before{background:var(--eureden-jaune);border-color:#000}
.bar{height:10px;border-radius:5px;background:var(--eureden-gris-clair);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--eureden-vert)}
.note{font-size:12px;color:var(--eureden-gris-fonce)}
.liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.liste li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 4px}
label.ligne{display:inline;text-transform:none;font-weight:600;letter-spacing:0;margin:0}
.champs select,.champs input,.champs textarea,dialog select,dialog input,dialog textarea{width:100%;border:1px solid var(--eureden-gris);border-radius:6px;padding:7px 9px;background:#fff;font-weight:400;text-transform:none}
dialog{border:0;border-radius:10px;padding:20px 22px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:520px;width:92vw;font-family:inherit;color:var(--eureden-gris-fonce)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.toast{position:fixed;right:22px;bottom:22px;background:#000;color:#fff;padding:12px 18px;border-radius:8px;z-index:50;font-weight:700;max-width:90vw}
.bloc-etat{max-width:560px;margin:12vh auto;padding:0 20px}
.bloc-etat .card{border-top:6px solid var(--eureden-jaune)}
.vide{padding:18px;text-align:center;color:var(--eureden-gris-fonce);background:var(--eureden-gris-clair);border-radius:8px}
[hidden]{display:none !important}
@media (max-width:860px){.app{grid-template-columns:1fr}header.top{grid-column:1}nav.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #ddd;padding:0}nav.side button{white-space:nowrap;border-left:0;border-bottom:4px solid transparent}nav.side button[aria-current=page]{border-bottom-color:var(--eureden-olive)}nav.side hr{display:none}main{padding:16px 14px}}
@media print{.bandeau,nav.side,header.top .ctl,.btn{display:none}}
</style>

</head>
<body>
  <div class="bandeau" aria-hidden="true"></div>
  <div id="chargement" class="bloc-etat"><div class="card"><h1>Eureden S&amp;OP</h1><p class="sub">Chargement…</p></div></div>
  <div id="erreur" class="bloc-etat" hidden>
    <div class="card">
      <h1>Accès impossible</h1>
      <p id="erreur-message" class="sub"></p>
      <p class="note">Code : <span id="erreur-code"></span>. Si le problème persiste, contactez l'administrateur de l'application.</p>
      <button class="btn" id="erreur-retour" type="button">Réessayer</button>
    </div>
  </div>
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="logo"><b>Eureden</b><small>S&amp;OP · Prévisions</small></div>
      <label class="ctl">Campagne<select id="camp"></select></label>
      <label class="ctl">Entité<select id="ent"></select></label>
      <div class="ctl">Unité
        <div class="seg" role="group" aria-label="Unité d'affichage" id="unites">
          <button type="button" aria-pressed="true" data-u="Q">Quantité</button>
          <button type="button" aria-pressed="false" data-u="H">Hectares</button>
          <button type="button" aria-pressed="false" data-u="E">Valeur €</button>
          <button type="button" disabled title="Disponible avec le catalogue des produits (poids des articles)">Tonnes</button>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn petit" id="actualiser" type="button" title="Relire les fichiers sources (l'historique est gardé 10 minutes en mémoire)">↻ Actualiser</button>
      <span id="entete-statut" class="pill p-info"></span>
      <div class="user"><b id="entete-utilisateur"></b><span id="entete-roles"></span></div>
    </header>
    <nav class="side" id="menu" aria-label="Navigation principale"></nav>
    <main id="contenu"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
(function () {
  'use strict';
  var App = window.App = { vues: {}, cache: {}, etat: { session: null, ecran: 'dashboard', campagne: '', entite: '', unite: 'Q', redessiner: null } };
  var $ = App.$ = function (s, r) { return (r || document).querySelector(s); };
  App.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var esc = App.esc = function (v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  // ---------- Formats et unités ----------
  var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  App.n0 = function (v) { return nf.format(Math.round(v || 0)); };
  App.pct = function (v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + ' %'; };
  // Unité d'affichage : Q quantité (unités de stock), H hectares, E valeur HT.
  App.UNITES = { Q: { cle: 'q', lbl: 'Quantité', suf: '' }, H: { cle: 'ha', lbl: 'Hectares', suf: ' ha' }, E: { cle: 'eur', lbl: 'Valeur €', suf: ' €' } };
  App.fmt = function (v) { return nf.format(Math.round(v || 0)) + App.UNITES[App.etat.unite].suf; };
  // Valeur d'un article dans l'unité choisie. champ : n1, statistique, evenements, correction, substitution, retenue.
  App.valArt = function (a, champ) {
    var u = App.etat.unite;
    if (champ === 'n1') return u === 'Q' ? a.n1 : (u === 'H' ? a.n1ha : a.n1eur);
    if (a[champ] === null || a[champ] === undefined) return null;
    return a[champ] * (u === 'Q' ? 1 : (u === 'H' ? a.rh : a.re));
  };
  // Totaux de l'entité filtrée (ou de toutes), dans l'unité choisie.
  App.totaux = function (liste) {
    var ent = App.etat.entite, cle = App.UNITES[App.etat.unite].cle;
    var t = { articles: 0, n1: 0, statistique: 0, tc: 0, evenements: 0, correction: 0, substitution: 0, retenue: 0 };
    (liste || []).forEach(function (x) {
      if (ent && x.entite !== ent) return;
      t.articles += x.articles;
      Object.keys(t).forEach(function (k) { if (k !== 'articles') t[k] += x[cle][k]; });
    });
    return t;
  };
  App.pill = function (classe, texte, symbole) {
    return '<span class="pill p-' + classe + '"><span aria-hidden="true">' + (symbole || '') + '</span>' + esc(texte) + '</span>';
  };
  App.variation = function (a, b) {
    if (!b) return a ? App.pill('info', 'Nouveau', '●') : '';
    var p = (a - b) / Math.abs(b) * 100;
    var seuil = (App.etat.session && App.etat.session.seuilEcart) || 15;
    return App.pill(Math.abs(p) > seuil ? 'warn' : 'info', App.pct(p), p >= 0 ? '▲' : '▼');
  };
  App.TYPES_VERSION = { PREV_TC: 'Prévision TC', STATISTIQUE: 'Statistique', ARBITREE: 'Arbitrée', VALIDEE: 'Validée' };
  App.typeVersion = function (t) { return App.TYPES_VERSION[t] || t; };
  App.NIVEAUX = { ERREUR: ['bad', '✖'], ATTENTION: ['warn', '⚠'], INFO: ['info', 'ℹ'], OK: ['ok', '✓'] };

  App.idOperation = function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'op-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  };

  App.toast = function (texte) {
    var t = $('#toast');
    t.textContent = texte; t.hidden = false;
    clearTimeout(App.toast.t); App.toast.t = setTimeout(function () { t.hidden = true; }, 4000);
  };

  // ---------- Appels serveur ----------
  // Renvoie { ok, data } ou { ok: false, code, message }. La campagne choisie accompagne chaque appel.
  App.appel = function (nom, args) {
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function () { resolve({ ok: false, code: 'RESEAU', message: 'Le serveur ne répond pas. Vérifiez votre connexion et réessayez.' }); })
        .api(nom, args || [], App.etat.campagne || '');
    });
  };
  // Lecture avec mémoire : une même donnée n'est demandée qu'une fois jusqu'à la prochaine écriture.
  App.donnees = function (nom, args) {
    var k = nom + '|' + JSON.stringify(args || []);
    if (!App.cache[k]) {
      App.cache[k] = App.appel(nom, args).then(function (r) { if (!r.ok) delete App.cache[k]; return r; });
    }
    return App.cache[k];
  };
  App.invalider = function () { App.cache = {}; };

  App.erreur = function (cible, r) {
    cible.innerHTML = '<div class="card"><h2>Données indisponibles</h2><p>' + esc(r.message) + '</p><p class="note">Code : ' + esc(r.code) + '</p></div>';
  };

  // ---------- Boîte de dialogue ----------
  // options : { titre, corps (html), ok (libellé), surOk: function () -> Promise<{ok,message}> | undefined }
  App.dialogue = function (o) {
    var d = $('#dlg');
    d.innerHTML = '<h2 style="margin:0 0 4px;color:#000">' + esc(o.titre) + '</h2><div class="champs">' + o.corps + '</div><p class="note" id="dlg-msg" role="status" style="color:#9B1C13"></p>' +
      '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" type="button" id="dlg-non">Annuler</button><button class="btn pri" type="button" id="dlg-ok">' + esc(o.ok || 'Valider') + '</button></div>';
    $('#dlg-non').onclick = function () { d.close(); };
    $('#dlg-ok').onclick = function () {
      var b = $('#dlg-ok'); b.disabled = true; $('#dlg-msg').textContent = '';
      Promise.resolve(o.surOk ? o.surOk() : { ok: true }).then(function (r) {
        b.disabled = false;
        if (r && r.ok === false) { $('#dlg-msg').textContent = r.message || 'Action impossible.'; return; }
        d.close();
      });
    };
    d.showModal();
    var premier = d.querySelector('input,select,textarea'); if (premier) premier.focus();
  };

  // ---------- Export ----------
  // Fichier CSV lisible par Excel (séparateur point-virgule, accents conservés). lignes : tableau de tableaux.
  App.telecharger = function (nom, lignes) {
    var cel = function (v) { var t = String(v === null || v === undefined ? '' : v); return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    var csv = '﻿' + lignes.map(function (l) { return l.map(cel).join(';'); }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  // ---------- Graphique en barres groupées ----------
  // series : [{ nom, couleur, valeurs: [] }], categories : []. Valeurs déjà dans l'unité d'affichage.
  App.barres = function (categories, series, hauteur) {
    var h = hauteur || 240, w = 620, pl = 56, pb = 26, pt = 10;
    var brut = Math.max.apply(null, [1].concat.apply([], series.map(function (s) { return s.valeurs; })));
    // Petites valeurs (comptages) : une graduation par entier ; sinon quatre graduations.
    var entiers = brut <= 6;
    var max = entiers ? Math.ceil(brut) : brut * 1.1, divisions = entiers ? Math.ceil(brut) : 4;
    var bw = (w - pl) / Math.max(1, categories.length);
    var y = function (v) { return pt + (h - pt - pb) * (1 - v / max); };
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="Graphique en barres">';
    for (var i = 0; i <= divisions; i++) {
      var v = max * i / divisions;
      s += '<line x1="' + pl + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e3e3e3"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="#444">' + nf.format(Math.round(v)) + '</text>';
    }
    var largeur = bw * 0.76 / series.length;
    categories.forEach(function (c, k) {
      var x = pl + k * bw;
      series.forEach(function (se, j) {
        var val = se.valeurs[k] || 0;
        s += '<rect x="' + (x + bw * 0.12 + j * largeur) + '" y="' + y(val) + '" width="' + (largeur - 2) + '" height="' + Math.max(0, h - pb - y(val)) + '" fill="' + se.couleur + '"><title>' + esc(se.nom + ' : ' + nf.format(Math.round(val))) + '</title></rect>';
      });
      s += '<text x="' + (x + bw / 2) + '" y="' + (h - 8) + '" font-size="10" text-anchor="middle" fill="#444">' + esc(c) + '</text>';
    });
    return s + '</svg>';
  };
  // Courbes : series [{ nom, couleur, valeurs, pointille }], repere facultatif { valeur, couleur, nom } (ligne horizontale).
  App.courbes = function (categories, series, hauteur, repere) {
    var h = hauteur || 240, w = 620, pl = 56, pb = 26, pt = 10, pd = 18;
    var toutes = [].concat.apply([], series.map(function (s) { return s.valeurs; })).concat(repere ? [repere.valeur] : [0]);
    var max = Math.max.apply(null, toutes.concat([1])), min = Math.min.apply(null, toutes.concat([0]));
    var etendue = (max - min) * 1.1 || 1;
    var y = function (v) { return pt + (h - pt - pb) * (1 - (v - min) / etendue); };
    var n = Math.max(1, categories.length - 1), x = function (i) { return pl + (w - pl - pd) * i / n; };
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="Courbe">';
    for (var i = 0; i <= 4; i++) {
      var v = min + etendue * i / 4;
      s += '<line x1="' + pl + '" x2="' + w + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e3e3e3"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="#444">' + nf.format(Math.round(v)) + '</text>';
    }
    if (min < 0) s += '<line x1="' + pl + '" x2="' + w + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#9B1C13" stroke-width="1.5"/>';
    if (repere) s += '<line x1="' + pl + '" x2="' + w + '" y1="' + y(repere.valeur) + '" y2="' + y(repere.valeur) + '" stroke="' + repere.couleur + '" stroke-dasharray="5 4" stroke-width="2"><title>' + esc(repere.nom) + '</title></line>';
    series.forEach(function (se) {
      s += '<polyline fill="none" stroke="' + se.couleur + '" stroke-width="2.5"' + (se.pointille ? ' stroke-dasharray="5 4"' : '') + ' points="' + se.valeurs.map(function (val, k) { return x(k) + ',' + y(val); }).join(' ') + '"><title>' + esc(se.nom) + '</title></polyline>';
    });
    var pas = Math.max(1, Math.ceil(categories.length / 12));
    categories.forEach(function (c, k) { if (k % pas === 0) s += '<text x="' + x(k) + '" y="' + (h - 8) + '" font-size="10" text-anchor="middle" fill="#444">' + esc(c) + '</text>'; });
    return s + '</svg>';
  };

  App.legende = function (series) {
    return '<div class="legend">' + series.map(function (s) { return '<span><i style="background:' + s.couleur + '"></i>' + esc(s.nom) + '</span>'; }).join('') + '</div>';
  };

  // ---------- Navigation ----------
  var MENU = [
    ['dashboard', '▦', 'Tableau de bord'], ['prevision', '✎', 'Prévision & arbitrage'], ['historique', '⟲', 'Historique & substitutions'],
    ['cadencage', '▤', 'Cadençage'], ['stocks', '▣', 'Projection des stocks'], ['versions', '✓', 'Versions & fiabilité'], '---',
    ['sources', '⛁', 'Sources de données'], ['controles', '⚙', 'Contrôles de mise en service']
  ];

  App.afficher = function (nom) {
    var s = App.etat.session;
    if (nom === 'controles' && !s.droits.configuration) nom = 'dashboard';
    App.etat.ecran = nom; App.etat.redessiner = null;
    $('#menu').innerHTML = MENU.filter(function (m) { return m === '---' || m[0] !== 'controles' || s.droits.configuration; }).map(function (m) {
      return m === '---' ? '<hr>' : '<button type="button" data-v="' + m[0] + '"' + (m[0] === nom ? ' aria-current="page"' : '') + '><span class="ico" aria-hidden="true">' + m[1] + '</span>' + esc(m[2]) + '</button>';
    }).join('');
    App.$$('#menu button').forEach(function (b) { b.onclick = function () { App.afficher(b.getAttribute('data-v')); }; });
    var c = $('#contenu');
    c.innerHTML = '<div class="card">Chargement…</div>';
    try { window.scrollTo(0, 0); } catch (e) { /* sans effet dans un cadre */ }
    (App.vues[nom] || App.vues.dashboard)(c);
  };

  // Les filtres de l'en-tête redessinent l'écran courant sans nouvel appel serveur.
  App.surFiltre = function () { if (App.etat.redessiner) App.etat.redessiner(); };

  function remplirEntete() {
    var s = App.etat.session;
    $('#camp').innerHTML = s.campagnes.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === s.campagne.id ? ' selected' : '') + '>' + esc(c.libelle) + '</option>'; }).join('');
    $('#ent').innerHTML = '<option value="">' + (s.entites.length > 1 ? s.entites.join(' + ') : 'Toutes') + '</option>' +
      (s.entites.length > 1 ? s.entites.map(function (e) { return '<option value="' + esc(e) + '">' + esc(e) + '</option>'; }).join('') : '');
    $('#ent').value = App.etat.entite;
    var st = s.campagne.statut;
    $('#entete-statut').className = 'pill ' + (st === 'OUVERTE' ? 'p-ok' : 'p-warn');
    $('#entete-statut').textContent = (st === 'OUVERTE' ? '✓ ' : '⚠ ') + st;
    $('#entete-utilisateur').textContent = s.utilisateur;
    $('#entete-roles').textContent = s.roles.join(', ');
    $('#camp').onchange = function () {
      App.etat.campagne = $('#camp').value;
      try { localStorage.setItem('sop-campagne', App.etat.campagne); } catch (e) { /* stockage indisponible */ }
      App.invalider(); App.demarrer();
    };
    $('#ent').onchange = function () { App.etat.entite = $('#ent').value; App.surFiltre(); };
    $('#actualiser').onclick = function () {
      var b = $('#actualiser'); b.disabled = true;
      App.appel('actualiser', []).then(function (r) {
        b.disabled = false;
        App.toast(r.ok ? 'Fichiers sources relus.' : r.message);
        App.invalider(); App.afficher(App.etat.ecran);
      });
    };
    App.$$('#unites button[data-u]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-u') === App.etat.unite ? 'true' : 'false');
      b.onclick = function () {
        App.etat.unite = b.getAttribute('data-u');
        App.$$('#unites button[data-u]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        App.surFiltre();
      };
    });
  }

  // Une erreur de rendu ne doit pas figer l'écran : on l'affiche et on garde le menu.
  window.addEventListener('error', function (e) {
    var c = $('#contenu');
    if (c && !$('#app').hidden) c.innerHTML = '<div class="card"><h2>Affichage impossible</h2><p>Une erreur d\'affichage est survenue. Rechargez la page ; si elle persiste, contactez l\'administrateur.</p><p class="note">' + esc(e.message || '') + '</p></div>';
  });

  App.demarrer = function () {
    $('#chargement').hidden = false; $('#erreur').hidden = true; $('#app').hidden = true;
    if (!App.etat.campagne) { try { App.etat.campagne = localStorage.getItem('sop-campagne') || ''; } catch (e) { App.etat.campagne = ''; } }
    App.appel('demarrage', []).then(function (r) {
      $('#chargement').hidden = true;
      if (!r.ok) {
        if (App.etat.campagne) { App.etat.campagne = ''; try { localStorage.removeItem('sop-campagne'); } catch (e) { /* ignoré */ } }
        $('#erreur').hidden = false; $('#erreur-message').textContent = r.message; $('#erreur-code').textContent = r.code;
        return;
      }
      App.etat.session = r.data;
      App.etat.campagne = r.data.campagne.id;
      if (App.etat.entite && r.data.entites.indexOf(App.etat.entite) < 0) App.etat.entite = '';
      $('#app').hidden = false;
      remplirEntete();
      App.afficher(App.etat.ecran || 'dashboard');
    });
  };
  $('#erreur-retour').onclick = function () { App.demarrer(); };
})();
</script>

  <script>
(function () {
  'use strict';
  var App = window.App, esc = App.esc;

  var COULEURS = { n1: '#8A8A8A', stat: '#84BD66', ret: '#514F21' };

  var NOMS_MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var libMois = function (m) { var p = m.split('-'); return NOMS_MOIS[Number(p[1]) - 1] + ' ' + p[0]; };

  function carteMensuelle(cad, bud) {
    if (!cad || !cad.mois || !cad.mois.length) return '';
    var cle = App.UNITES[App.etat.unite].cle, ent = App.etat.entite;
    var val = function (m) { return Object.keys(m.parEntite).reduce(function (s, e) { return s + (!ent || e === ent ? m.parEntite[e][cle] : 0); }, 0); };
    var series = [{ nom: 'Retenue', couleur: COULEURS.ret, valeurs: cad.mois.map(val) }];
    var b = budgetPour(bud, cad, ent);
    if (b) series.push({ nom: 'Budget', couleur: '#444444', valeurs: b.parMois });
    return '<div class="card" style="margin-top:16px"><h2>Prévision mensuelle <small>' + esc(App.UNITES[App.etat.unite].lbl.toLowerCase()) + ', cadençage hebdomadaire regroupé par mois du jeudi</small></h2>' + App.barres(cad.mois.map(function (m) { return libMois(m.mois); }), series, 220) + App.legende(series) + '</div>';
  }

  // Budget sur les mois du cadençage, dans l'unité choisie (quantité ou valeur ; pas d'hectares au budget).
  // Renvoie null si le budget, le cadençage ou l'unité manquent. entite : '' = toutes.
  function budgetPour(bud, cad, entite) {
    if (!bud || !bud.disponible || !cad || !cad.mois || !cad.mois.length || App.etat.unite === 'H') return null;
    var cle = App.etat.unite === 'E' ? 'eur' : 'q';
    if ((cle === 'q' && !bud.avecQuantite) || (cle === 'eur' && !bud.avecValeur)) return null;
    var mois = cad.mois.map(function (m) { return m.mois; });
    var parMois = mois.map(function (m) {
      var ligne = bud.mois.filter(function (x) { return x.mois === m; })[0];
      if (!ligne) return 0;
      return Object.keys(ligne.parEntite).reduce(function (s2, e) { return s2 + (!entite || e.toUpperCase() === entite.toUpperCase() ? ligne.parEntite[e][cle] : 0); }, 0);
    });
    return { mois: mois, parMois: parMois, total: parMois.reduce(function (a, b) { return a + b; }, 0) };
  }

  function kpiBudget(bud, cad, t) {
    if (bud === undefined) return ['Budget', '…', App.pill('info', 'Chargement', 'ℹ')];
    if (!bud || !bud.disponible) return ['Budget', 'Non connecté', App.pill('info', bud && bud.raison && /ne permet pas/.test(bud.raison) ? 'Accès réservé' : 'Source BUDGET à déclarer', 'ℹ')];
    if (App.etat.unite === 'H') return ['Budget ' + bud.annee, '—', App.pill('info', 'Pas d\'hectares au budget', 'ℹ')];
    var b = budgetPour(bud, cad, App.etat.entite);
    if (!b) return ['Budget ' + bud.annee, 'Cadençage requis', App.pill('info', 'Pour comparer aux mêmes mois', 'ℹ')];
    var ecart = b.total ? (t.retenue / b.total - 1) * 100 : 0;
    return ['Budget ' + bud.annee + ' (' + bud.version + ')', App.fmt(b.total), App.pill(Math.abs(ecart) > 5 ? 'warn' : 'ok', 'Retenue vs budget ' + App.pct(ecart), Math.abs(ecart) > 5 ? '⚠' : '✓')];
  }

  function dessiner(c, d, fiab, cad, bud) {
    var s = App.etat.session, t = App.totaux(d.totaux);
    var ref = d.anneeReference || 'N-1';
    var prevue = s.campagne.anneePrevision || '';
    var alertes = d.alertes || [];
    var n = { ERREUR: 0, ATTENTION: 0, INFO: 0 };
    alertes.forEach(function (a) { n[a.niveau] = (n[a.niveau] || 0) + 1; });
    var ouvertes = n.ERREUR + n.ATTENTION;

    var kpiFiab;
    if (fiab === undefined) kpiFiab = ['Fiabilité de la méthode', '…', App.pill('info', 'Calcul en cours', 'ℹ')];
    else if (!fiab) kpiFiab = ['Fiabilité de la méthode', '—', App.pill('info', 'Il faut deux années d\'historique', 'ℹ')];
    else {
      var r = fiab.resultats.filter(function (x) { return x.actuelle; })[0] || fiab.resultats[fiab.meilleur];
      var b = Math.round(r.biais * 100);
      kpiFiab = ['Fiabilité de la méthode (test ' + fiab.anneeTestee + ')', 'Erreur ' + Math.round(r.erreur * 100) + ' %',
        App.pill('info', 'Biais ' + (b > 0 ? '+' : '') + b + ' % (' + (b > 0 ? 'sur' : 'sous') + '-prévision)', 'ℹ')];
    }
    var kpis = [
      ['Prévision retenue' + (prevue ? ' ' + prevue : ''), App.fmt(t.retenue), d.version ? App.pill(t.retenue >= t.n1 ? 'ok' : 'warn', 'vs ' + ref + ' ' + (t.n1 ? App.pct((t.retenue / t.n1 - 1) * 100) : '—'), t.retenue >= t.n1 ? '▲' : '▼') : App.pill('info', 'Pas encore calculée', 'ℹ')],
      ['Prévision des TC', d.tc && d.tc.couverture ? App.fmt(t.tc) : 'Non connectée', d.tc && d.tc.couverture ? App.pill(d.tc.couverture.tcAyantSaisi < d.tc.couverture.tc ? 'warn' : 'ok', d.tc.couverture.tcAyantSaisi + ' TC sur ' + d.tc.couverture.tc + ' ont saisi', d.tc.couverture.tcAyantSaisi < d.tc.couverture.tc ? '⚠' : '✓') : (d.tc && d.tc.erreur ? App.pill('bad', 'Fichier illisible', '✖') : App.pill('info', 'Source PREV_TC à déclarer', 'ℹ'))],
      kpiBudget(bud, cad, t),
      kpiFiab,
      ['Alertes ouvertes', String(ouvertes), (n.ERREUR ? App.pill('bad', n.ERREUR + ' erreur(s)', '✖') + ' ' : '') + (n.ATTENTION ? App.pill('warn', n.ATTENTION + ' à vérifier', '⚠') : (ouvertes ? '' : App.pill('ok', 'Rien à signaler', '✓')))]
    ];
    var kpiHtml = kpis.map(function (k) { return '<div class="card kpi"><div class="l">' + esc(k[0]) + '</div><div class="v">' + esc(k[1]) + '</div><div class="d">' + k[2] + '</div></div>'; }).join('');

    var lignes = d.totaux.filter(function (x) { return !App.etat.entite || x.entite === App.etat.entite; });
    var cle = App.UNITES[App.etat.unite].cle;
    var series = [
      { nom: 'Réalisé ' + ref, couleur: COULEURS.n1, valeurs: lignes.map(function (x) { return x[cle].n1; }) },
      { nom: 'Statistique', couleur: COULEURS.stat, valeurs: lignes.map(function (x) { return x[cle].statistique; }) },
      { nom: 'Prévision des TC', couleur: '#BAD264', valeurs: lignes.map(function (x) { return x[cle].tc; }) },
      { nom: 'Retenue', couleur: COULEURS.ret, valeurs: lignes.map(function (x) { return x[cle].retenue; }) }
    ];
    var graphique = lignes.length ? App.barres(lignes.map(function (x) { return x.entite; }), series) + App.legende(series) : '<div class="vide">Pas de prévision à afficher.</div>';

    var al = alertes.length ? alertes.map(function (a) {
      var nv = App.NIVEAUX[a.niveau] || App.NIVEAUX.INFO;
      return '<div class="alert">' + App.pill(nv[0], a.titre, nv[1]) + '<span>' + esc(a.detail) + '</span></div>';
    }).join('') : '<div class="vide">Aucune alerte.</div>';

    var lecture = function (x) {
      var m = x[cle];
      if (!d.version) return App.pill('info', 'À calculer', 'ℹ');
      if (m.n1 && Math.abs(m.retenue / m.n1 - 1) * 100 > (s.seuilEcart || 15)) return App.pill('warn', 'Écart ' + ref + ' élevé', '⚠');
      return App.pill('ok', 'Dans la cible', '✓');
    };
    var avecBudget = !!budgetPour(bud, cad, '');
    var cellBudget = function (entite, retenue) {
      var bb = budgetPour(bud, cad, entite);
      return bb ? '<td class="n">' + App.fmt(bb.total) + '</td><td class="n">' + (bb.total ? App.pct((retenue / bb.total - 1) * 100) : '—') + '</td>' : '<td class="n">–</td><td class="n">–</td>';
    };
    var tableau = '<thead><tr><th>Entité</th><th class="n">Articles</th><th class="n">Réalisé ' + esc(ref) + '</th><th class="n">Statistique</th><th class="n">Prév. TC</th><th class="n">Retenue</th><th class="n">vs ' + esc(ref) + '</th>' + (avecBudget ? '<th class="n">Budget</th><th class="n">vs budget</th>' : '') + '<th>Lecture</th></tr></thead><tbody>' +
      lignes.map(function (x) {
        var m = x[cle];
        return '<tr><td><b>' + esc(x.entite) + '</b></td><td class="n">' + App.n0(x.articles) + '</td><td class="n">' + App.fmt(m.n1) + '</td><td class="n">' + App.fmt(m.statistique) + '</td><td class="n">' + (d.tc && d.tc.couverture ? App.fmt(m.tc) : '–') + '</td><td class="n"><b>' + App.fmt(m.retenue) + '</b></td><td class="n">' + (m.n1 ? App.pct((m.retenue / m.n1 - 1) * 100) : '—') + '</td>' + (avecBudget ? cellBudget(x.entite, m.retenue) : '') + '<td>' + lecture(x) + '</td></tr>';
      }).join('') +
      (lignes.length > 1 ? '<tr class="tot"><td>Total</td><td class="n">' + App.n0(t.articles) + '</td><td class="n">' + App.fmt(t.n1) + '</td><td class="n">' + App.fmt(t.statistique) + '</td><td class="n">' + (d.tc && d.tc.couverture ? App.fmt(t.tc) : '–') + '</td><td class="n">' + App.fmt(t.retenue) + '</td><td class="n">' + (t.n1 ? App.pct((t.retenue / t.n1 - 1) * 100) : '—') + '</td>' + (avecBudget ? cellBudget(App.etat.entite, t.retenue) : '') + '<td></td></tr>' : '') + '</tbody>';

    // Vue comité par marché (catalogue EurePrev) : mêmes colonnes, entité filtrée par l'en-tête.
    var parMarche = '';
    var marches = {};
    (d.totauxMarche || []).forEach(function (x) {
      if (App.etat.entite && x.entite !== App.etat.entite || !x.marche) return;
      var m = marches[x.marche] = marches[x.marche] || { articles: 0, n1: 0, statistique: 0, tc: 0, retenue: 0 };
      m.articles += x.articles;
      ['n1', 'statistique', 'tc', 'retenue'].forEach(function (k) { m[k] += x[cle][k]; });
    });
    var nomsMarches = Object.keys(marches).sort();
    if (nomsMarches.length) {
      parMarche = '<div class="card"><h2>Vue comité par marché <small>maille marché (groupe de structure du catalogue)</small></h2><div class="scroll"><table><thead><tr><th>Marché</th><th class="n">Articles</th><th class="n">Réalisé ' + esc(ref) + '</th><th class="n">Statistique</th><th class="n">Prév. TC</th><th class="n">Retenue</th><th class="n">vs ' + esc(ref) + '</th><th>Lecture</th></tr></thead><tbody>' +
        nomsMarches.map(function (nom) {
          var m = marches[nom];
          var lect = !d.version ? App.pill('info', 'À calculer', 'ℹ') : (m.n1 && Math.abs(m.retenue / m.n1 - 1) * 100 > (s.seuilEcart || 15) ? App.pill('warn', 'Écart ' + ref + ' élevé', '⚠') : App.pill('ok', 'Dans la cible', '✓'));
          return '<tr><td><b>' + esc(nom) + '</b></td><td class="n">' + App.n0(m.articles) + '</td><td class="n">' + App.fmt(m.n1) + '</td><td class="n">' + App.fmt(m.statistique) + '</td><td class="n">' + (d.tc && d.tc.couverture ? App.fmt(m.tc) : '–') + '</td><td class="n"><b>' + App.fmt(m.retenue) + '</b></td><td class="n">' + (m.n1 ? App.pct((m.retenue / m.n1 - 1) * 100) : '—') + '</td><td>' + lect + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    var tl = d.echeances.length ? '<div class="tl">' + d.echeances.map(function (e) {
      var dates = e.debut ? (e.debut + (e.fin ? ' → ' + e.fin : '')) : '';
      return '<div class="' + (e.courante ? 'cur' : '') + '">' + esc(e.libelle) + '<br><span class="note">' + esc(e.statut.toLowerCase()) + (dates ? '<br>' + esc(dates) : '') + '</span></div>';
    }).join('') + '</div>' : '<div class="vide">Aucune campagne dans CAMPAGNES.</div>';

    var v = d.version;
    c.innerHTML = '<h1>Bonjour <span class="acc">' + esc(prenom(s.utilisateur)) + '</span></h1>' +
      '<p class="sub">Comité S&amp;OP – <b>' + esc(s.campagne.libelle || s.campagne.id) + '</b>' + (prevue ? ' · prévision ' + esc(prevue) : '') + (v ? ' · version ' + esc(App.typeVersion(v.type).toLowerCase()) + ' ' + esc(v.id) + ' du ' + esc(v.creeLe.slice(0, 10)) : ' · aucune version') + '</p>' +
      '<div class="grid g5">' + kpiHtml + '</div>' +
      '<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Prévision par entité <small>' + esc(App.UNITES[App.etat.unite].lbl.toLowerCase()) + '</small></h2>' + graphique + '</div>' +
      '<div class="card"><h2>Alertes automatiques <small>' + alertes.length + ' au total</small></h2>' + al + '</div></div>' +
      carteMensuelle(cad, bud) +
      '<div class="card" style="margin-top:16px"><h2>Vue comité par entité <small>maille entité</small></h2><div class="scroll"><table>' + tableau + '</table></div>' +
      '<p class="note">' + (nomsMarches.length ? '' : 'La vue par marché apparaît quand le catalogue est lu (source PREV_TC, sortie EurePrev). ') + (App.etat.unite !== 'Q' ? ' Hectares et valeur sont déduits de la dernière année de vente de chaque article.' : '') + '</p></div>' +
      parMarche +
      '<div class="card"><h2>Campagnes <small>statut de chaque campagne</small></h2>' + tl + '</div>';
  }

  // Le prénom se déduit de l'adresse (prenom.nom@...). Sans point : la partie avant @.
  function prenom(email) {
    var local = String(email || '').split('@')[0].split('.')[0];
    return local ? local.charAt(0).toUpperCase() + local.slice(1) : '';
  }

  App.vues.dashboard = function (c) {
    var etat = { d: null, fiab: undefined, cad: null, bud: undefined };
    var redessiner = function () { if (etat.d) dessiner(c, etat.d, etat.fiab, etat.cad, etat.bud); };
    App.etat.redessiner = redessiner;
    App.donnees('tableauDeBord').then(function (r) {
      if (App.etat.ecran !== 'dashboard') return;
      if (!r.ok) { App.erreur(c, r); return; }
      etat.d = r.data; redessiner();
      App.donnees('cadencage').then(function (k) {
        if (App.etat.ecran !== 'dashboard') return;
        etat.cad = k.ok ? k.data : null; redessiner();
      });
      App.donnees('budget').then(function (b) {
        if (App.etat.ecran !== 'dashboard') return;
        etat.bud = b.ok ? b.data : { disponible: false, raison: b.message }; redessiner();
      });
      App.donnees('essaiPonderation').then(function (f) {
        if (App.etat.ecran !== 'dashboard') return;
        etat.fiab = f.ok ? f.data : null; redessiner();
      });
    });
  };
})();
</script>

  <script>
(function () {
  'use strict';
  var App = window.App, esc = App.esc;

    function nouvelle(a) {
      var m = etat.modif[cle(a)];

    var ratio = function (a) { return App.etat.unite === 'Q' ? 1 : (App.etat.unite === 'H' ? a.rh : a.re); };

      return '<table><thead><tr><th>Article</th><th>Entité</th><th class="n">Réalisé ' + esc(ref) + '</th><th class="n">Statistique</th><th class="n">Prév. TC</th><th class="n">Événements</th><th class="n">Substitutions</th><th class="n">Correction (' + esc(unite) + ')</th><th class="n">Retenue</th><th class="n">vs ' + esc(ref) + '</th><th>Statut</th></tr></thead><tbody>' + (corps || '<tr><td colspan="11" class="note">Aucun article ne correspond.</td></tr>') + '</tbody></table>' +

    }

    function detail() {

      if (!a) return '<h2>Détail article</h2><p class="note">Cliquez sur une ligne pour voir les sources et les saisies de l\'article.</p>';
      var peutAnnuler = droits.correctionPrevision && ouverte;
      var sais = [];
      etat.aj.corrections.filter(function (x) { return x.code === a.code && x.entite === a.entite; }).forEach(function (x) {

      });

      });
      etat.aj.substitutions.filter(function (x) { return (x.ancien === a.code || x.nouveau === a.code) && (!x.entite || x.entite === a.entite); }).forEach(function (x) {

      return '<h2>' + esc(a.libelle || a.code) + ' <small>' + esc(a.code) + ' · ' + esc(a.entite) + '</small></h2><div class="grid g2"><div><table><thead><tr><th>Source</th><th class="n">Volume</th></tr></thead><tbody>' +

(function () {

  App.vues.cadencage = function (c) {
    var etat = { d: null, niveau: 'GLOBAL', cle: '*', coefs: {}, de: '', a: '' };
    var droits = App.etat.session.droits;
    var ouverte = ['GELEE', 'CLOTUREE'].indexOf(App.etat.session.campagne.statut) < 0;
    var peutEditer = droits.arbitrage && ouverte;

    function jeu(niveau, cle) {
      return etat.d.jeux.filter(function (j) { return j.niveau === niveau && j.cle === cle; })[0] || null;
    }
    function charger(niveau, cle) {
      etat.niveau = niveau; etat.cle = cle;
      var j = jeu(niveau, cle);

      var ks = Object.keys(etat.coefs).map(Number).sort(function (x, y) { return x - y; });
      etat.de = ks.length ? String(ks[0]) : ''; etat.a = ks.length ? String(ks[ks.length - 1]) : '';
    }

      return Object.keys(etat.coefs).reduce(function (s, k) { var v = Number(String(etat.coefs[k]).replace(',', '.')); return s + (isFinite(v) ? v : 0); }, 0);

        (peutEditer ? '<option value="NOUVEAU|MARCHE">+ Cadençage d\'un marché…</option><option value="NOUVEAU|ARTICLE">+ Cadençage d\'un article…</option>' : '');

      var sem = semainesAffichees();

        return '<tr><td>' + esc(d.annee + '-S' + ('0' + n).slice(-2)) + '</td><td>' + esc(libMois(moisDe(n))) + '</td><td class="n"><input class="cell' + (etat.coefs[n] !== undefined && etat.coefs[n] !== '' ? ' changed' : '') + '" type="text" inputmode="decimal" data-sem="' + n + '" value="' + esc(etat.coefs[n] === undefined ? '' : etat.coefs[n]) + '"' + (peutEditer ? '' : ' disabled') + ' aria-label="Coefficient semaine ' + n + '"></td></tr>';
      }).join('') + '</tbody></table></div>' : '';

          '<label class="ctl" style="margin:0">Dernière semaine<input id="k-a" type="number" min="1" max="' + d.nbSemaines + '" value="' + esc(etat.a) + '" style="width:90px"></label>' +

        '<div style="margin-top:12px">' + graphiqueCoefs() + '</div><div style="margin-top:10px">' + grille + '</div>' +
        '<div class="row" style="margin-top:12px"><span id="k-somme" class="pill ' + (ok ? 'p-ok' : 'p-bad') + '">' + (ok ? '✓ ' : '✖ ') + 'Total ' + (Math.round(total * 100) / 100) + ' %' + (ok ? '' : ' – doit faire 100 %') + '</span>' +
        (peutEditer ? '<button class="btn pri" id="k-save" type="button">Enregistrer le cadençage</button>' : '') +
        (j && droits.validation && ouverte && j.validation !== 'VALIDE' ? '<button class="btn" id="k-valider" type="button">Valider ce cadençage</button>' : '') +
        (peutEditer && j && j.niveau !== 'GLOBAL' ? '<button class="btn" id="k-suppr" type="button">Supprimer</button>' : '') +
        '<span id="k-msg" class="note" role="status"></span></div>' +
        '<p class="note">Un coefficient est la part du besoin livrée la semaine indiquée ; les coefficients d\'un jeu font 100. Les semaines sont des semaines ISO de ' + esc(d.annee) + ', rattachées au mois de leur jeudi. Le cadençage d\'un article remplace celui de son marché, qui remplace le cadençage global.</p>';

        mois.map(function (m) { return '<tr><td>' + esc(libMois(m.m.mois)) + '</td><td class="n">' + App.fmt(m.v) + '</td><td class="n">' + (totalGeneral ? Math.round(m.v / totalGeneral * 100) : 0) + ' %</td></tr>'; }).join('') +
        '<tr class="tot"><td>Total</td><td class="n">' + App.fmt(totalGeneral) + '</td><td class="n">100 %</td></tr></tbody></table></div></div>' +
        '<div class="scroll" style="max-height:300px;margin-top:12px"><table><thead><tr><th>Semaine</th><th>Mois</th><th class="n">Quantité retenue</th><th class="n">Part</th></tr></thead><tbody>' +
        parts.map(function (p) { return '<tr><td>' + esc(p.x.etiquette) + '</td><td>' + esc(libMois(p.x.mois)) + '</td><td class="n">' + App.fmt(p.v) + '</td><td class="n">' + (totalGeneral ? (p.v / totalGeneral * 100).toFixed(1).replace('.', ',') : '0') + ' %</td></tr>'; }).join('') + '</tbody></table></div>' +
        (d.nonCadences ? '<p class="note">' + App.pill('warn', d.nonCadences + ' article(s) sans cadençage', '⚠') + ' ne figurent pas dans cette répartation ni dans la publication. Définissez un cadençage global pour tous les couvrir.</p>' : '');
    }

    function dessiner() {
      var d = etat.d;
      if (!d) return;
      if (!d.annee) {
        c.innerHTML = '<h1>Cadençage</h1><p class="sub">Répartition du besoin de la campagne sur les semaines.</p><div class="card"><h2>Année de prévision manquante</h2><p>Renseignez la colonne « Annee prevision » de la campagne dans l\'onglet CAMPAGNES des paramètres.</p></div>';
        return;
      }
      c.innerHTML = '<h1>Cadençage</h1><p class="sub">Répartition du besoin de la campagne sur les semaines de livraison de ' + esc(d.annee) + ', puis sur les mois du comité.</p>' +
        '<div class="card"><h2>Coefficients <small>pourcentage du besoin par semaine ISO</small></h2>' + editeur() + '</div>' +
        '<div class="card"><h2>Résultat <small>' + esc(App.UNITES[App.etat.unite].lbl.toLowerCase()) + ', quantité retenue</small></h2>' + resultat() + '</div>';
      brancher();
    }

    function majSomme() {
      var total = somme(), ok = Math.abs(total - 100) <= 0.01, el = c.querySelector('#k-somme');
      el.className = 'pill ' + (ok ? 'p-ok' : 'p-bad');
      el.textContent = (ok ? '✓ ' : '✖ ') + 'Total ' + (Math.round(total * 100) / 100) + ' %' + (ok ? '' : ' – doit faire 100 %');
    }

    function brancher() {
      c.querySelector('#k-jeu').onchange = function (e) {
        var v = e.target.value;
        if (v.indexOf('NOUVEAU|') === 0) {
          var niveauNouveau = v.split('|')[1], estMarche = niveauNouveau === 'MARCHE';
          App.dialogue({
            titre: estMarche ? 'Cadençage d\'un marché' : 'Cadençage d\'un article', ok: 'Continuer',
            corps: estMarche && etat.d.marches.length
              ? '<label for="n-code">Marché</label><select id="n-code">' + etat.d.marches.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select><p class="note">Le cadençage du marché remplace le cadençage global pour ses articles, sauf ceux qui ont leur propre cadençage.</p>'
              : '<label for="n-code">' + (estMarche ? 'Marché' : 'Code produit') + '</label><input id="n-code" maxlength="60"><p class="note">' + (estMarche ? 'Le catalogue (source PREV_TC) n\'est pas lu : saisissez le nom du marché tel qu\'il y figure.' : 'Le cadençage de cet article remplacera celui de son marché ou le cadençage global.') + '</p>',
            surOk: function () {
              var code = (document.querySelector('#dlg #n-code').value || '').trim();
              if (!code) return { ok: false, message: estMarche ? 'Le marché est obligatoire.' : 'Le code produit est obligatoire.' };
              charger(niveauNouveau, code);
              var g = jeu('GLOBAL', '*');
              if (g && !Object.keys(etat.coefs).length) Object.keys(g.semaines).forEach(function (k) { etat.coefs[k] = String(g.semaines[k]); });
              var ks = Object.keys(etat.coefs).map(Number).sort(function (x, y) { return x - y; });

          });

      if (u) u.onclick = function () {

        etat.coefs = {};

        for (var s = d1; s <= a1; s++) etat.coefs[s] = String(s === d1 ? Math.round((base + reste) * 100) / 100 : base);

      var col = c.querySelector('#k-coller');

        App.dialogue({
          titre: 'Coller des coefficients', ok: 'Appliquer',
          corps: '<p class="note">Une valeur par semaine, séparées par des retours à la ligne, des espaces ou des points-virgules, à partir de la première semaine indiquée. Les valeurs peuvent venir d\'une colonne de votre fichier Qlik.</p><label for="p-vals">Coefficients (%)</label><textarea id="p-vals" rows="6"></textarea><label for="p-debut">Première semaine</label><input id="p-debut" type="number" min="1" value="' + esc(etat.de || '') + '">',

            if (debut + vals.length - 1 > etat.d.nbSemaines) return { ok: false, message: 'Trop de valeurs : l\'année n\'a que ' + etat.d.nbSemaines + ' semaines.' };
            etat.coefs = {}; vals.forEach(function (v, i) { if (v > 0) etat.coefs[debut + i] = String(v); });
            etat.de = String(debut); etat.a = String(debut + vals.length - 1);
            dessiner(); return { ok: true };
          }
        });
      };
      App.$$('input[data-sem]', c).forEach(function (i) {
        i.oninput = function () { etat.coefs[i.getAttribute('data-sem')] = i.value; majSomme(); };
        i.onchange = function () { dessiner(); };
      });
      var sv = c.querySelector('#k-save');
      if (sv) sv.onclick = function () {
        sv.disabled = true; c.querySelector('#k-msg').textContent = 'Enregistrement…';
        App.appel('sauverCoefficients', [{ niveau: etat.niveau, cle: etat.cle, coefficients: etat.coefs, origine: 'MANUEL' }, App.idOperation()]).then(function (r) {
          sv.disabled = false;
          if (!r.ok) { c.querySelector('#k-msg').textContent = r.message; return; }
          App.toast('Cadençage enregistré (version ' + r.data.resultat.version + ').'); recharger(etat.niveau, etat.cle);
        });
      };
      var va = c.querySelector('#k-valider');
      if (va) va.onclick = function () {
        App.appel('validerCoefficients', [etat.niveau, etat.cle, App.idOperation()]).then(function (r) {
          if (!r.ok) { c.querySelector('#k-msg').textContent = r.message; return; }
          App.toast('Cadençage validé.'); recharger(etat.niveau, etat.cle);
        });
      };
      var su = c.querySelector('#k-suppr');
      if (su) su.onclick = function () {
        App.dialogue({
          titre: 'Supprimer le cadençage ' + (etat.niveau === 'MARCHE' ? 'du marché ' : 'de l\'article ') + etat.cle, ok: 'Supprimer',
          corps: '<p>' + (etat.niveau === 'MARCHE' ? 'Les articles de ce marché reprendront le cadençage global.' : 'L\'article reprendra le cadençage de son marché ou le cadençage global.') + '</p>',
          surOk: function () {
            return App.appel('supprimerCoefficients', [etat.niveau, etat.cle, App.idOperation()]).then(function (r) {
              if (!r.ok) return r; App.toast('Cadençage supprimé.'); recharger('GLOBAL', '*'); return r;
            });
          }
        });
      };
    }

    function recharger(niveau, cle) {
      App.invalider();
      return App.donnees('cadencage').then(function (r) {
        if (App.etat.ecran !== 'cadencage') return;
        if (!r.ok) { App.erreur(c, r); return; }
        etat.d = r.data;
        if (niveau && !(niveau !== 'GLOBAL' && !jeu(niveau, cle))) charger(niveau, cle);
        else if (!jeu(etat.niveau, etat.cle) && etat.niveau === 'GLOBAL') charger('GLOBAL', '*');
        dessiner();
      });
    }
    App.etat.redessiner = dessiner;
    recharger('GLOBAL', '*');
  };
})();
</script>

      if (!r || !r.disponible) return '<div class="vide">' + esc(r ? r.raison : 'Indisponible.') + '</div>';
      var b = Math.round(r.global.biais * 100);
      return '<p>Prévision ' + esc(r.version.id) + ' (' + esc(App.typeVersion(r.version.type).toLowerCase()) + ') comparée aux ventes de ' + esc(r.annee) + '.</p><div class="grid g3" style="margin:8px 0">' +
        '<div class="kpi card"><div class="l">Erreur</div><div class="v">' + Math.round(r.global.erreur * 100) + ' %</div></div>' +
        '<div class="kpi card"><div class="l">Biais</div><div class="v">' + (b > 0 ? '+' : '') + b + ' %</div><div class="d">' + App.pill('info', b > 0 ? 'sur-prévision' : 'sous-prévision', 'ℹ') + '</div></div></div>' +
        '<table><thead><tr><th>Entité</th><th class="n">Articles</th><th class="n">Prévu</th><th class="n">Réel</th><th class="n">Erreur</th><th class="n">Biais</th></tr></thead><tbody>' + r.parEntite.map(function (x) {
          return '<tr><td>' + esc(x.entite) + '</td><td class="n">' + App.n0(x.nb) + '</td><td class="n">' + App.n0(x.prevu) + '</td><td class="n">' + App.n0(x.reel) + '</td><td class="n">' + Math.round(x.erreur * 100) + ' %</td><td class="n">' + App.pct(x.biais * 100) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    function fiabilite() {
      var f = etat.fiab;
      var bouton = '<div class="row"><button class="btn" id="v-essai" type="button">Tester les pondérations sur l\'historique</button><span id="v-essai-msg" class="note" role="status"></span></div>';
      var intro = '<p>L\'application refait la prévision de la dernière année avec les années d\'avant seulement, puis la compare au réalisé, pour plusieurs pondérations.</p>';
      if (!f) return intro + bouton;
      var lignes = f.resultats.map(function (x, i) {
        var b = Math.round(x.biais * 100);
        return '<tr><td>' + esc(x.ponderation.join(' / ')) + (x.actuelle ? ' ' + App.pill('info', 'Réglage actuel', '●') : '') + (i === f.meilleur ? ' ' + App.pill('ok', 'La plus juste', '✓') : '') + '</td><td class="n">' + Math.round(x.erreur * 100) + ' %</td><td class="n">' + (b > 0 ? '+' : '') + b + ' %</td></tr>';
      }).join('');
      return intro + bouton + '<p class="note" style="margin-top:10px">Test sur ' + esc(f.anneeTestee) + ' avec ' + esc(f.anneesBase.join(', ')) + ' (' + App.n0(f.nbArticles) + ' articles).</p><div class="scroll"><table><thead><tr><th>Pondération (année récente d\'abord)</th><th class="n">Erreur</th><th class="n">Biais</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' +
        '<p class="note"><b>Erreur :</b> écart entre prévu et réel, article par article, rapporté aux ventes. <b>Biais :</b> écart sur le total (positif = sur-prévision). Pour changer la pondération : réglage PONDERATION_ANNEES, puis recalcul.</p>';
    }

    function blocComparaison() {
      var v = etat.v;
      if (v.length < 2) return '<div class="vide">Il faut au moins deux versions pour les comparer.</div>';
      var opt = function (sel) { return v.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === sel ? ' selected' : '') + '>' + esc(x.id + ' · ' + App.typeVersion(x.type)) + '</option>'; }).join(''); };
      var cmp = etat.cmp;
      var a = cmp ? cmp.a.id : v[v.length - 2].id, b = cmp ? cmp.b.id : v[v.length - 1].id;
      var tableau = '';
      if (cmp) {
        tableau = '<p style="margin-top:10px">' + esc(cmp.a.id) + ' : <b>' + App.n0(cmp.totaux.a) + '</b> → ' + esc(cmp.b.id) + ' : <b>' + App.n0(cmp.totaux.b) + '</b> · écart <b>' + (cmp.totaux.delta > 0 ? '+' : '') + App.n0(cmp.totaux.delta) + '</b> (' + cmp.nbModifiees + ' article(s) modifié(s) sur ' + cmp.nbLignes + ')</p>' +
          (cmp.lignes.length ? '<div class="scroll" style="max-height:340px"><table><thead><tr><th>Article</th><th>Entité</th><th class="n">' + esc(cmp.a.id) + '</th><th class="n">' + esc(cmp.b.id) + '</th><th class="n">Écart</th></tr></thead><tbody>' + cmp.lignes.map(function (l) {
            return '<tr><td><b>' + esc(l.libelle || l.code) + '</b><br><span class="note">' + esc(l.code) + '</span></td><td>' + esc(l.entite) + '</td><td class="n">' + App.n0(l.a) + '</td><td class="n">' + App.n0(l.b) + '</td><td class="n">' + App.pill(l.delta > 0 ? 'ok' : 'warn', (l.delta > 0 ? '+' : '') + App.n0(l.delta), l.delta > 0 ? '▲' : '▼') + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="vide">Les deux versions sont identiques.</div>') + '<p class="note">Quantités en unités de stock.</p>';
      }
      return '<div class="row"><label class="ctl" style="margin:0">De<select id="c-a">' + opt(a) + '</select></label><label class="ctl" style="margin:0">À<select id="c-b">' + opt(b) + '</select></label><button class="btn pri" id="c-go" type="button">Comparer</button><span id="c-msg" class="note" role="status"></span></div>' + tableau;
    }

    function blocJournal() {
      if (!(droits.configuration || droits.arbitrage)) return '';
      var j = etat.journal;
      var corps = j === undefined ? '<p class="note">Chargement…</p>' : (!j ? '' : (j.length ? '<div class="scroll" style="max-height:340px"><table><thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Objet</th><th>Détail</th></tr></thead><tbody>' + j.map(function (x) {
        var detail = [x.avant && x.apres ? x.avant + ' → ' + x.apres : (x.apres || x.avant), x.motif].filter(Boolean).join(' · ');
        return '<tr><td class="n">' + esc(x.le.replace('T', ' ')) + '</td><td>' + esc(x.par) + '</td><td>' + esc(ACTIONS[x.action] || x.action) + '</td><td>' + esc(x.objet) + '</td><td>' + esc(detail) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="vide">Journal vide.</div>'));
      return '<div class="card"><h2>Journal des modifications <small>200 dernières entrées</small></h2>' + corps + '</div>';
    }

    function dessiner() {
      if (!etat.v) return;
      c.innerHTML = '<h1>Versions &amp; fiabilité</h1><p class="sub">Retracer chaque reprévision, valider la version du comité et mesurer la fiabilité.</p>' +
        '<div class="grid g2"><div class="card"><h2>Historique des versions <small>' + esc(App.etat.session.campagne.libelle || App.etat.session.campagne.id) + '</small></h2>' + liste() + '</div>' +
        '<div class="card"><h2>Fiabilité de la prévision <small>prévu contre réalisé</small></h2>' + blocReelle() + '<h2 style="margin-top:18px">Fiabilité de la méthode</h2>' + fiabilite() + '</div></div>' +
        '<div class="card" style="margin-top:16px"><h2>Écarts entre versions</h2>' + blocComparaison() + '</div>' +
        '<div class="card"><h2>Exports pour le comité</h2><div class="row"><button class="btn" id="x-prev" type="button">⬇ Prévision courante (Excel)</button><button class="btn" id="x-cmp" type="button"' + (etat.cmp ? '' : ' disabled') + '>⬇ Écarts de versions (Excel)</button>' + (etat.journal ? '<button class="btn" id="x-jrn" type="button">⬇ Journal (Excel)</button>' : '') + '</div><p class="note">Fichiers CSV avec séparateur point-virgule, ouverts directement par Excel.</p></div>' + blocJournal();
      brancher();
    }

    function brancher() {
      App.$$('[data-valider]', c).forEach(function (b) {
        b.onclick = function () {
          App.dialogue({
            titre: 'Valider la version ' + b.getAttribute('data-valider'), ok: 'Valider et verrouiller',
            corps: '<p>La version validée devient la prévision de référence de la campagne : les quantités retenues sont figées dans « Qte validee » et la version est verrouillée. Cette action est définitive.</p>' +
              '<label for="d-com">Commentaire</label><textarea id="d-com" rows="2" placeholder="Ex. Comité S&amp;OP du 12/10"></textarea>',
            surOk: function () {
              var com = (document.querySelector('#dlg #d-com') || {}).value || '';
              return App.appel('validerVersion', [{ commentaire: com.trim() }, App.idOperation()]).then(function (r) {
                if (!r.ok) return r;
                var pub = r.data.resultat.publication;
                App.toast('Version ' + r.data.resultat.idVersion + ' validée (' + r.data.resultat.lignes + ' lignes). ' + (pub && pub.ecrit ? 'Publication : ' + App.n0(pub.mensuelle) + ' lignes mensuelles, ' + App.n0(pub.hebdo) + ' hebdomadaires.' : 'Publication non écrite : ' + (pub ? pub.raison : 'indisponible')));
                recharger(); return r;
              });
            }
          });
        };
      });
      var rp = c.querySelector('#v-republier');
      if (rp) rp.onclick = function () {
        App.dialogue({
          titre: 'Republier la version validée', ok: 'Republier',
          corps: '<p>Les onglets PUBLICATION_MENSUELLE, PUBLICATION_HEBDO et CONTRAT sont réécrits à partir de la version validée et du cadençage actuel. Les autres applications lisent ces onglets.</p>',
          surOk: function () {
            return App.appel('republier', [App.idOperation()]).then(function (r) {
              if (!r.ok) return r;
              var p = r.data.resultat;
              App.toast(p.ecrit ? 'Publication écrite : ' + App.n0(p.mensuelle) + ' lignes mensuelles, ' + App.n0(p.hebdo) + ' hebdomadaires.' : 'Publication non écrite : ' + p.raison);
              recharger(); return r;
            });
          }
        });
      };
      var e = c.querySelector('#v-essai');
      if (e) e.onclick = function () {
        e.disabled = true; c.querySelector('#v-essai-msg').textContent = 'Test en cours…';
        App.donnees('essaiPonderation').then(function (r) {
          if (!r.ok) { e.disabled = false; c.querySelector('#v-essai-msg').textContent = r.message; return; }
          etat.fiab = r.data; dessiner();
        });
      };
      var go = c.querySelector('#c-go');
      if (go) go.onclick = function () {
        var a = c.querySelector('#c-a').value, b = c.querySelector('#c-b').value;
        go.disabled = true; c.querySelector('#c-msg').textContent = 'Comparaison…';
        App.donnees('comparerVersions', [a, b]).then(function (r) {
          if (!r.ok) { go.disabled = false; c.querySelector('#c-msg').textContent = r.message; return; }
          etat.cmp = r.data; dessiner();
        });
      };
      c.querySelector('#x-prev').onclick = function () {
        App.appel('exportPrevision', []).then(function (r) {
          if (!r.ok) { App.toast(r.message); return; }
          var d = r.data, ent = App.etat.entite, ref = d.anneeReference || 'N-1';
          var lignes = [['Code', 'Libellé', 'Entité', 'Réalisé ' + ref, 'Statistique', 'Événements', 'Corrections', 'Substitutions', 'Retenue', 'Retenue en hectares', 'Retenue en valeur HT']];
          d.articles.filter(function (a) { return !ent || a.entite === ent; }).forEach(function (a) {
            lignes.push([a.code, a.libelle, a.entite, a.n1, a.statistique, a.evenements, a.correction, a.substitution, a.retenue, Math.round(a.retenue * a.rh * 100) / 100, Math.round(a.retenue * a.re * 100) / 100].map(function (v) { return typeof v === 'number' ? Math.round(v * 1000) / 1000 : v; }));
          });
          App.telecharger('prevision-' + App.etat.session.campagne.id + (d.version ? '-' + d.version.id : '') + '.csv', lignes);
        });
      };
      var xc = c.querySelector('#x-cmp');
      if (xc) xc.onclick = function () {
        var m = etat.cmp, lignes = [['Code', 'Libellé', 'Entité', m.a.id, m.b.id, 'Écart']];
        m.lignes.forEach(function (l) { lignes.push([l.code, l.libelle, l.entite, l.a, l.b, l.delta]); });
        App.telecharger('ecarts-' + m.a.id + '-' + m.b.id + '.csv', lignes);
      };
      var xj = c.querySelector('#x-jrn');
      if (xj) xj.onclick = function () {
        var lignes = [['Quand', 'Qui', 'Action', 'Objet', 'Avant', 'Après', 'Motif']];
        etat.journal.forEach(function (x) { lignes.push([x.le, x.par, ACTIONS[x.action] || x.action, x.objet, x.avant, x.apres, x.motif]); });
        App.telecharger('journal-' + App.etat.session.campagne.id + '.csv', lignes);
      };
    }

    function recharger() {
      App.invalider();
      return App.donnees('versions').then(function (r) {
        if (App.etat.ecran !== 'versions') return;
        if (!r.ok) { App.erreur(c, r); return; }
        etat.v = r.data; etat.cmp = null; dessiner();
        App.donnees('fiabiliteReelle').then(function (f) { etat.reelle = f.ok ? f.data : { disponible: false, raison: f.message }; if (App.etat.ecran === 'versions') dessiner(); });
        if (droits.configuration || droits.arbitrage) {
          App.donnees('journal', [200]).then(function (j) { etat.journal = j.ok ? j.data : null; if (App.etat.ecran === 'versions') dessiner(); });
        }
      });
    }
    App.etat.redessiner = dessiner;
    recharger();
  };

  // ---------- Sources de données ----------
  var ETATS = {
    OK: ['ok', 'Connectée', '✓'], ERREUR: ['bad', 'Erreur', '✖'], A_CONNECTER: ['warn', 'À connecter', '⚠'],
    INACTIF: ['info', 'Inactive', '●'], AUTRE_CAMPAGNE: ['info', 'Autre campagne', '●']
  };
  App.vues.sources = function (c) {
    App.donnees('sources').then(function (r) {
      if (App.etat.ecran !== 'sources') return;
      if (!r.ok) { App.erreur(c, r); return; }
      var d = r.data;
      var lignes = d.sources.map(function (s) {
        var e = ETATS[s.etat] || ETATS.ERREUR;
        var contenu = [s.entite, s.pac].filter(Boolean).join(' · ');
        return '<tr><td><b>' + esc(s.libelle) + '</b><br><span class="note">' + esc(s.id) + '</span></td><td>' + esc(contenu) + '</td><td>' + esc(s.alimentation || 'Lecture en direct') + '</td><td class="n">' + (s.lignes !== undefined ? App.n0(s.lignes) : '–') + '</td><td>' + App.pill(e[0], e[1], e[2]) + '<br><span class="note">' + esc(s.detail) + '</span></td><td>' + (s.lien ? '<a href="' + esc(s.lien) + '" target="_blank" rel="noopener">Ouvrir</a>' : '') + '</td></tr>';
      }).join('');
      c.innerHTML = '<h1>Sources de données</h1><p class="sub">L\'application lit et écrit dans des Google Sheets, alimentés de façons diverses.</p>' +
        '<div class="card"><div class="scroll"><table><thead><tr><th>Source</th><th>Contenu</th><th>Alimentation</th><th class="n">Lignes</th><th>État</th><th></th></tr></thead><tbody>' + (lignes || '<tr><td colspan="6" class="note">Aucune source déclarée dans SOURCES.</td></tr>') + '</tbody></table></div>' +
        '<p class="note" style="margin-top:10px">Principe : les fichiers « entrées » (ventes, stocks, budget) sont en lecture seule dans l\'application ; les fichiers « sorties » (versions, prévision, corrections, journal) sont écrits par l\'application. Une source se déclare dans l\'onglet SOURCES des paramètres.</p></div>' +
        (d.fichiers.length ? '<div class="card"><h2>Fichiers de l\'application</h2><ul class="liste">' + d.fichiers.map(function (f) { return '<li><b>' + esc(f.nom) + '</b> <a href="' + esc(f.lien) + '" target="_blank" rel="noopener">Ouvrir</a></li>'; }).join('') + '</ul></div>' : '');
    });
  };

  // ---------- Contrôles de mise en service ----------
  App.vues.controles = function (c) {
    c.innerHTML = '<h1>Contrôles de mise en service</h1><p class="sub">Vérifie les classeurs, la campagne, les accès et les sources avant l\'ouverture.</p>' +
      '<div class="card"><div class="row"><button class="btn pri" id="c-lancer" type="button">Lancer les contrôles</button><span id="c-etat" class="note" role="status"></span></div><div id="c-res" style="margin-top:12px"></div></div>';
    c.querySelector('#c-lancer').onclick = function () {
      var b = c.querySelector('#c-lancer'); b.disabled = true; c.querySelector('#c-etat').textContent = 'Contrôle en cours…';
      App.appel('controles', []).then(function (r) {
        b.disabled = false; c.querySelector('#c-etat').textContent = '';
        if (!r.ok) { c.querySelector('#c-res').innerHTML = '<p>' + esc(r.message) + '</p>'; return; }
        c.querySelector('#c-res').innerHTML = '<div class="scroll"><table><thead><tr><th>Résultat</th><th>Sujet</th><th>Détail</th></tr></thead><tbody>' + r.data.map(function (x) {
          var n = App.NIVEAUX[x.niveau] || App.NIVEAUX.ATTENTION;
          return '<tr><td>' + App.pill(n[0], x.niveau, n[1]) + '</td><td>' + esc(x.sujet) + '</td><td>' + esc(x.detail) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      });
    };
  };
})();
</script>

  <script>App.demarrer();</script>
</body>
</html>
